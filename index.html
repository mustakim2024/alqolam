<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALQOLAM 5.0</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #0a5c2e;
    font-family: 'Inter', Arial, sans-serif;
  }
  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a5c2e;
    color: #f5d060;
    z-index: 10;
    transition: opacity .3s ease;
  }
  #loader .spinner {
    width: 44px;
    height: 44px;
    border: 4px solid rgba(245, 208, 96, 0.25);
    border-top-color: #f5d060;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 14px;
  }
  #loader .txt {
    font-size: 13px;
    letter-spacing: 1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #appFrame {
    width: 100%;
    height: 100vh;
    border: none;
    display: block;
  }
  #fallback {
    display: none;
    position: fixed;
    inset: 0;
    background: #fff;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 24px;
  }
  #fallback a {
    margin-top: 14px;
    display: inline-block;
    background: #0a5c2e;
    color: #fff;
    padding: 10px 22px;
    border-radius: 7px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
  }
</style>
</head>
<body>

<div id="loader">
  <div class="spinner"></div>
  <div class="txt">MEMUAT ALQOLAM 5.0...</div>
</div>

<iframe id="appFrame"
        src="GANTI_DENGAN_URL_EXEC_KAMU"
        allow="clipboard-write"
        onload="document.getElementById('loader').style.display='none';">
</iframe>

<div id="fallback">
  <div>
    <p style="font-size:15px;color:#333">Aplikasi tidak dapat dimuat di sini.</p>
    <a href="https://script.google.com/macros/s/AKfycbycoUdZKRx81uYV8Jn2hKuGXBPzRu2Ty10Id8QPHCyQiliB5O2qs2_Bv4VZ9YIlTsiz/exec
" target="_blank" rel="noopener">Buka Langsung di Tab Baru</a>
  </div>
</div>

<script>
  // Jika iframe gagal load dalam 8 detik, tampilkan fallback
  setTimeout(function () {
    var loader = document.getElementById('loader');
    if (loader && loader.style.display !== 'none') {
      loader.style.display = 'none';
      document.getElementById('appFrame').style.display = 'none';
      document.getElementById('fallback').style.display = 'flex';
    }
  }, 8000);
</script>

</body>
</html>
