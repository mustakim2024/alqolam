<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALQOLAM 5.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f4f4f0;color:#111;min-height:100vh}
#loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0a5c2e,#1a7a42)}
.lbox{background:#fff;border-radius:20px;padding:44px 40px;width:380px;max-width:94vw;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.llogo{text-align:center;margin-bottom:28px}
.lring{width:96px;height:96px;border-radius:50%;border:3px solid #c9981a;overflow:hidden;margin:0 auto 12px;background:#fff;display:flex;align-items:center;justify-content:center}
.lring img{width:92px;height:92px;object-fit:cover;border-radius:50%;display:block}
.lname{font-family:'Cinzel',serif;font-size:21px;font-weight:700;color:#0a5c2e;letter-spacing:3px}
.lver{font-size:12px;color:#c9981a;font-weight:700;letter-spacing:4px;margin-top:3px}
.ltag{font-size:11px;color:#999;margin-top:5px;font-style:italic}
.lbl{display:block;font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.8px;margin:14px 0 6px}
.finp{width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;color:#111;background:#fafaf6}
.finp:focus{outline:none;border-color:#0a5c2e}
.btnlogin{width:100%;margin-top:18px;padding:13px;background:#0a5c2e;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.btnlogin:hover{background:#1a7a42}.btnlogin:disabled{background:#999;cursor:not-allowed}
#msgbox{border-radius:8px;font-size:13px;padding:10px 13px;margin-top:10px;display:none;word-break:break-all}
.merr{background:#fff0ee;border:1px solid #f5c6c0;color:#c0392b}
.mok{background:#f0fff4;border:1px solid #b7ebc8;color:#0a5c2e}
.minf{background:#e8f4ff;border:1px solid #90cdf4;color:#1a4a8a}
.lfoot{text-align:center;margin-top:18px;font-size:11px;color:#aaa;font-style:italic}
#appShell{display:none;flex-direction:column;min-height:100vh}
.hdr{background:#0a5c2e;height:62px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hbrand{display:flex;align-items:center;gap:11px}
.hlogo{width:42px;height:42px;border-radius:50%;overflow:hidden;background:#fff;border:2px solid #c9981a;flex-shrink:0}
.hlogo img{width:100%;height:100%;object-fit:cover;display:block}
.htitle{font-family:'Cinzel',serif;font-size:17px;font-weight:700;color:#fff;letter-spacing:2px}
.hver{font-size:10px;color:#f5d060;letter-spacing:2px}
.hright{display:flex;align-items:center;gap:12px}
.huser{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.9);font-size:13px}
.ava{width:30px;height:30px;border-radius:50%;background:#c9981a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#0a5c2e}
.boutbtn{padding:5px 13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:20px;font-size:12px;cursor:pointer}
.boutbtn:hover{background:rgba(255,255,255,.22)}
.nav{background:#fff;border-bottom:2px solid #e0e0e0;display:flex;padding:0 20px;overflow-x:auto}
.ntab{padding:12px 18px;font-size:13px;font-weight:700;color:#999;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.ntab:hover{color:#0a5c2e}.ntab.on{color:#0a5c2e;border-bottom-color:#c9981a}
.appmain{flex:1;padding:22px;max-width:1060px;margin:0 auto;width:100%;background:#f4f4f0;min-height:500px}
.pg{display:none}.pg.on{display:block}
.ph{margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid #ddd}
.ph h2{font-size:18px;font-weight:700;color:#0a5c2e}.ph p{font-size:13px;color:#999;margin-top:3px}
.card{background:#fff;border-radius:10px;border:1px solid #e0e0e0;margin-bottom:18px;overflow:hidden}
.chead{padding:14px 20px;border-bottom:1px solid #e0e0e0;background:#f8f8f5;font-weight:700;color:#0a5c2e;font-size:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.cbody{padding:20px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.fl{display:block;font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.req{color:red}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:10px 13px;border:1.5px solid #ccc;border-radius:7px;font-size:14px;font-family:'Inter',sans-serif}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0a5c2e}
.cc{font-size:11px;color:#aaa;text-align:right;margin-top:2px}.cc.warn{color:red}
.rpw{position:relative}.rppfx{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:700;color:#666;pointer-events:none}
.rpw input{padding-left:32px}
.act{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.btnp{padding:10px 20px;background:#0a5c2e;color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer}
.btnp:hover{background:#1a7a42}.btnp:disabled{background:#999;cursor:not-allowed}
.btno{padding:10px 20px;background:transparent;border:1.5px solid #0a5c2e;color:#0a5c2e;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer}
.btno:hover{background:#0a5c2e;color:#fff}
.divhr{height:1px;background:#eee;margin:16px 0}
.sesi-hd{font-size:13px;font-weight:700;color:#fff;padding:8px 14px;border-radius:6px;margin-bottom:10px}
.sesi-pagi{background:#1a4a8a}.sesi-sore{background:#c9981a}
.clsec{background:#f4f4f0;border-radius:8px;padding:14px;margin-bottom:12px}
.clttl{font-size:13px;font-weight:700;color:#0a5c2e;margin-bottom:10px}
.clgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clgrid1{display:grid;grid-template-columns:1fr;gap:8px}
.ci{display:flex;align-items:center;gap:8px;padding:9px 11px;background:#fff;border-radius:7px;border:1.5px solid #ddd;cursor:pointer;font-size:13px;color:#555;user-select:none}
.ci.on{border-color:#0a5c2e;background:rgba(10,92,46,.06);color:#0a5c2e;font-weight:700}
.cbox{width:18px;height:18px;border:2px solid #ccc;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:transparent}
.ci.on .cbox{background:#0a5c2e;border-color:#0a5c2e;color:#fff}
.ci-libur{border-color:#c0392b!important;background:rgba(192,57,43,.06)!important;color:#c0392b!important;font-weight:700}
.ci-libur .cbox{background:#c0392b!important;border-color:#c0392b!important;color:#fff!important}
.mover{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.mover.on{display:flex}
.mbox{background:#fff;border-radius:14px;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.mhd{background:#0a5c2e;padding:15px 20px;color:#fff;font-size:14px;font-weight:700}
.mbd{padding:20px}.mbd p{font-size:13px;color:#555;margin-bottom:12px}
.dtbl{width:100%;border-collapse:collapse}
.dtbl td{padding:8px 11px;font-size:13px;border-bottom:1px solid #eee}
.dtbl td:first-child{font-weight:700;color:#555;width:38%;background:#f8f8f5}
.mft{padding:13px 20px;border-top:1px solid #eee;display:flex;gap:10px;justify-content:flex-end}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:10px 12px;text-align:left;font-size:10px;font-weight:700;color:#0a5c2e;text-transform:uppercase;letter-spacing:.7px;border-bottom:2px solid #c9981a;background:#f4f4f0}
.tbl td{padding:9px 12px;border-bottom:1px solid #eee;vertical-align:middle}
.tbl tr:hover td{background:rgba(10,92,46,.025)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.bg{background:rgba(10,92,46,.12);color:#0a5c2e}.bo{background:rgba(201,152,26,.15);color:#8b6914}
.bw{background:#eee;color:#777}.bb{background:rgba(26,74,138,.12);color:#1a4a8a}
.br{background:rgba(192,57,43,.12);color:#c0392b}.blibur{background:#f5c6c0;color:#c0392b}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.sc{background:#fff;border-radius:10px;padding:16px;border:1px solid #e0e0e0;border-right:4px solid #c9981a}
.sl{font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.sv{font-size:22px;font-weight:700;color:#0a5c2e;line-height:1;margin-bottom:3px}
.sss{font-size:11px;color:#aaa}
.ibxrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;margin-bottom:4px}
.ibx{border-radius:10px;padding:18px 20px;color:#fff;flex:1;min-width:130px}
.ibx-g{background:#0a5c2e}.ibx-b{background:#1a4a8a}.ibx-r{background:#7b1a1a}.ibx-v{background:#4a235a}
.ibxlbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:3px}
.ibxval{font-size:20px;font-weight:700;color:#f5d060}
.chw{background:#fff;border-radius:10px;padding:20px;border:1px solid #e0e0e0;margin-top:16px}
.smg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:18px}
.smc{background:#fff;border-radius:10px;border:1px solid #e0e0e0;overflow:hidden}
.smh{padding:12px 16px;font-weight:700;font-size:13px;color:#fff}
.smh.t{background:#0a5c2e}.smh.b{background:#1a4a8a}.smh.k{background:#6b1a1a}
.smh.f{background:#4a235a}.smh.o{background:#7b4a00}
.smbd{padding:13px 16px}
.smr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:13px}
.smr:last-child{border:none}.smk{color:#666}.smv{font-weight:700;color:#0a5c2e}
.fbr{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.fbr select{max-width:120px}
.toast{position:fixed;bottom:20px;right:20px;color:#fff;padding:12px 16px;border-radius:7px;font-size:13px;font-weight:700;z-index:2000;display:none;max-width:300px}
.toast.on{display:block}.tok{background:#0a5c2e}.terr{background:#c0392b}
.rek-box{background:#f0f7ff;border:1px solid #90cdf4;border-radius:7px;padding:10px 13px;font-size:12px;color:#1a4a8a;margin-top:6px;line-height:1.6}
@media(max-width:600px){.fg2,.clgrid{grid-template-columns:1fr}.appmain{padding:14px}.smg{grid-template-columns:1fr}.lbox{padding:32px 20px}}
</style>
</head>

// ---- API CALL via fetch() ----
var GAS_API = "https://script.google.com/macros/s/AKfycbycoUdZKRx81uYV8Jn2hKuGXBPzRu2Ty10Id8QPHCyQiliB5O2qs2_Bv4VZ9YIlTsiz/exec";

function gasCall(fn, args, onOk, onErr) {
  fetch(GAS_API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fn: fn, args: args || [] })
  })
  .then(function(resp) { return resp.json(); })
  .then(function(r) {
    if (r && r.ok === false) { if (onErr) onErr(r.msg || 'Error'); }
    else { if (onOk) onOk(r); }
  })
  .catch(function(e) {
    if (onErr) onErr('Fetch error: ' + String(e));
  });
}

// ---- OFFLINE ----
function filterArr(arr,f){
  if(!f) return arr;
  return arr.filter(function(d){
    var tgl=d.tanggal||'';
    if(f.bulan&&(new Date(tgl).getMonth()+1)!=f.bulan) return false;
    if(f.tahun&&new Date(tgl).getFullYear()!=f.tahun) return false;
    return true;
  });
}
function offlineCall(fn,args,ok,err){
  switch(fn){
    case 'checkLogin':{
      var u=String(args[0]).toLowerCase().trim(), p=String(args[1]).trim();
      if(USERS_OFF[u]&&USERS_OFF[u].pw===p) ok({ok:true,username:u,name:USERS_OFF[u].name,role:USERS_OFF[u].role});
      else ok({ok:false,msg:'Username atau password salah.'});
      break;
    }
    case 'saveTabuk':{ var a=L('tabuk_data',[]); args[0].id='TBK-'+Date.now(); args[0].ts=new Date().toISOString(); a.push(args[0]); S('tabuk_data',a); ok({ok:true}); break; }
    case 'saveKebersihan':{ var a=L(args[0]+'_data',[]); args[1].ts=new Date().toISOString(); a.push(args[1]); S(args[0]+'_data',a); ok({ok:true}); break; }
    case 'saveOjol':{ var a=L('ojol_data',[]); var d=args[0]; d.id='OJL-'+Date.now(); d.ts=new Date().toISOString(); d.total=(+d.nominal_per_paket*+d.penerima)+(+d.biaya_lain); a.push(d); S('ojol_data',a); ok({ok:true}); break; }
    case 'saveKeuangan':{ var a=L('keuangan',[]); var last=a.length?Number(a[a.length-1].saldo):0; var jml=Number(args[0].jumlah); var sal=args[0].jenis==='pemasukan'?last+jml:last-jml; args[0].saldo=sal; args[0].id='KAU-'+Date.now(); args[0].ts=new Date().toISOString(); a.push(args[0]); S('keuangan',a); ok({ok:true,saldo:sal}); break; }
    case 'getTabuk':    ok({ok:true,data:filterArr(L('tabuk_data',[]).reverse(),args[0])}); break;
    case 'getKebersihan': ok({ok:true,data:filterArr(L(args[0]+'_data',[]).reverse(),args[1])}); break;
    case 'getOjol':     ok({ok:true,data:filterArr(L('ojol_data',[]).reverse(),args[0])}); break;
    case 'getKeuangan':{ var d=filterArr(L('keuangan',[]).reverse(),args[0]); if(args[0]&&args[0].jenis)d=d.filter(function(x){return x.jenis===args[0].jenis;}); ok({ok:true,data:d}); break; }
    case 'getBudget':   var bg=L('budget',{total:0,keterangan:''}); bg.ok=true; ok(bg); break;
    case 'saveBudgetAdmin': S('budget',{total:args[0],keterangan:args[1]}); ok({ok:true}); break;
    case 'getKeuanganSummary':{ var a=L('keuangan',[]); var msk=0,klr=0,sal=a.length?Number(a[a.length-1].saldo):0; for(var i=0;i<a.length;i++){if(a[i].jenis==='pemasukan')msk+=Number(a[i].jumlah);else klr+=Number(a[i].jumlah);} ok({ok:true,totalMasuk:msk,totalKeluar:klr,saldoAkhir:sal}); break; }
    case 'getAdminSummary':{ var a=L('keuangan',[]); var msk=0,klr=0,sal=a.length?Number(a[a.length-1].saldo):0; for(var i=0;i<a.length;i++){if(a[i].jenis==='pemasukan')msk+=Number(a[i].jumlah);else klr+=Number(a[i].jumlah);} ok({ok:true,tabuk:L('tabuk_data',[]).reverse(),badar:L('badar_data',[]).reverse(),khandaq:L('khandaq_data',[]).reverse(),ojol:L('ojol_data',[]).reverse(),budget:L('budget',{total:0,keterangan:''}),keuangan:{totalMasuk:msk,totalKeluar:klr,saldoAkhir:sal}}); break; }
    default: if(err)err('Fungsi tidak dikenal: '+fn);
  }
}

// ---- UTILS ----
function rp(n){ return 'Rp '+(n?Number(n).toLocaleString('id-ID'):'0'); }
function td(){ return new Date().toISOString().split('T')[0]; }
function fL(t){ try{ return new Date(t).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }catch(e){ return t; } }
function fS(t){ try{ return new Date(t).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){ return t; } }
function isSabAhad(tgl){ var d=new Date(tgl).getDay(); return d===0||d===6; }
function uCC(id,cid,max){ var v=document.getElementById(id).value.length; var el=document.getElementById(cid); el.textContent=v+'/'+max; el.className='cc'+(v>=max?' warn':''); }
function SK(n){ var s='<div style="padding:16px">'; for(var i=0;i<n;i++) s+='<div style="height:14px;background:#eee;border-radius:4px;margin-bottom:8px;width:'+Math.round(45+Math.random()*45)+'%"></div>'; return s+'</div>'; }
function showMsg(txt,cls){ var el=document.getElementById('msgbox'); el.textContent=txt; el.className=cls; el.style.display='block'; }
function hideMsg(){ document.getElementById('msgbox').style.display='none'; }
function toast(msg,ok){ var el=document.getElementById('toastEl'); el.textContent=(ok?'[OK] ':'[!] ')+msg; el.className='toast on '+(ok?'tok':'terr'); setTimeout(function(){ el.className='toast'; },3000); }
function openM(){ document.getElementById('modal').classList.add('on'); }
function closeM(){ document.getElementById('modal').classList.remove('on'); }

document.addEventListener('DOMContentLoaded', function(){

  function doLogin(){
    var u=uIn.value.trim(), p=pIn.value.trim();

    hideMsg(); btnMasuk.disabled=true; btnMasuk.textContent='Memverifikasi...';
    gasCall('checkLogin',[u,p],
      function(res){
        btnMasuk.disabled=false; btnMasuk.textContent='Masuk';

      },

  });

    if(!PEND) return;
    var btn=this; btn.disabled=true; btn.textContent='Menyimpan...';
    var p=PEND; PEND=null;
    var fn, args;
    if(p.type==='tabuk')    { fn='saveTabuk';     args=[p]; }

    gasCall(fn,args,
      function(){ btn.disabled=false; btn.textContent='Simpan'; closeM(); toast('Data berhasil disimpan!',true);
        if(p.type==='tabuk') rstTabuk(); else if(p.type==='keu') rstKeu(); else if(p.type==='ojol') rstOjol(); else rstCL(p.type); },
      function(m){ btn.disabled=false; btn.textContent='Simpan'; toast('Gagal: '+m,false); }
    );
  });
});

  for(var i=0;i<tabs.length;i++){

        '<div class="sc"><div class="sl">Sore Lengkap</div><div class="sv">'+soreOk+'</div><div class="sss">6/6 item</div></div>'+
        '</div>';

    if(!data.length){ b.innerHTML='<tr><td colspan="6" style="text-align:center;padding:30px;color:#aaa">Belum ada data.</td></tr>'; return; }
    var rows='';
    for(var i=0;i<data.length;i++){
      var d=data[i], pl=d.sesi_pagi?d.sesi_pagi.length:0, sl=d.sesi_sore?d.sesi_sore.length:0;
      rows+='<tr><td>'+(i+1)+'</td><td><span class="badge bg">'+fS(d.tanggal)+'</span></td>'+
        '<td><span class="badge '+(d.status==='LIBUR'?'blibur':'bg')+'">'+d.status+'</span></td>'+

        '<td><span class="badge '+(sl===BADAR_SORE_IT.length?'bg':sl>0?'bo':'bw')+'">'+sl+'/'+BADAR_SORE_IT.length+'</span></td>'+
        '<td style="font-size:12px;color:#aaa">'+(d.catatan_sabtu_ahad||'-')+'</td></tr>';

    '</div></div>';
}
function hitung_ojol(){
  var pnrm=Number(document.getElementById('oj_pnrm').value)||0;
  var nom=Number(document.getElementById('oj_nom').value)||0;
  var biaya=Number(document.getElementById('oj_biaya').value)||0;
  var tot=(pnrm*nom)+biaya;
  var el=document.getElementById('oj_total'); if(el) el.textContent=rp(tot);
}
function rstOjol(){
  ['oj_tgl','oj_pnrm','oj_nom','oj_biaya','oj_kbiaya'].forEach(function(id){var el=document.getElementById(id);if(el)el.value=id==='oj_tgl'?td():''});
  var cc=document.getElementById('cc_oj');if(cc){cc.textContent='0/20';cc.className='cc';}
  var tot=document.getElementById('oj_total');if(tot)tot.textContent='Rp 0';
}
function draftOjol(){
  var tgl=document.getElementById('oj_tgl').value;
  var pnrm=document.getElementById('oj_pnrm').value;
  var nom=document.getElementById('oj_nom').value;
  var biaya=document.getElementById('oj_biaya').value||'0';
  var kbiaya=document.getElementById('oj_kbiaya').value.trim();
  if(!tgl||!pnrm||!nom){ toast('Lengkapi field wajib!',false); return; }
  var tot=(Number(pnrm)*Number(nom))+Number(biaya);
  document.getElementById('draftT').innerHTML=
    '<tr><td>Tanggal</td><td>'+fL(tgl)+'</td></tr>'+
    '<tr><td>Jumlah Penerima</td><td>'+pnrm+' orang</td></tr>'+
    '<tr><td>Nominal per Paket</td><td>'+rp(nom)+'</td></tr>'+
    '<tr><td>Biaya Lain-lain</td><td>'+rp(biaya)+(kbiaya?' ('+kbiaya+')':'')+'</td></tr>'+
    '<tr><td>Total Biaya</td><td><b>'+rp(tot)+'</b></td></tr>';
  PEND={type:'ojol',tanggal:tgl,penerima:Number(pnrm),nominal_per_paket:Number(nom),biaya_lain:Number(biaya),ket_biaya_lain:kbiaya}; openM();
}

function loadOjol(){
  var mE=document.getElementById('oj_fm'), yE=document.getElementById('oj_fy'), f={};
  if(mE&&mE.value) f.bulan=Number(mE.value); if(yE&&yE.value) f.tahun=Number(yE.value);
  gasCall('getOjol',[f],function(res){
    var data=res.data||[], totP=0, totT=0;
    for(var i=0;i<data.length;i++){ totP+=Number(data[i].penerima)||0; totT+=Number(data[i].total)||0; }
    var st=document.getElementById('ojStat'); if(st)
      st.innerHTML='<div class="sg">'+
        '<div class="sc"><div class="sl">Total Kegiatan</div><div class="sv">'+data.length+'</div><div class="sss">distribusi</div></div>'+
        '<div class="sc"><div class="sl">Total Penerima</div><div class="sv">'+totP.toLocaleString('id-ID')+'</div><div class="sss">orang</div></div>'+
        '<div class="sc"><div class="sl">Total Biaya</div><div class="sv" style="font-size:15px">'+rp(totT)+'</div><div class="sss">keseluruhan</div></div></div>';
    chartLine('chOj','oj',data.map(function(d){return{tgl:d.tanggal,val:Number(d.penerima)||0};}));
    var b=document.getElementById('oj_tb'); if(!b) return;
    if(!data.length){ b.innerHTML='<tr><td colspan="7" style="text-align:center;padding:30px;color:#aaa">Belum ada data.</td></tr>'; return; }
    var rows=''; for(var i=0;i<data.length;i++){
      var d=data[i];
      rows+='<tr><td>'+(i+1)+'</td><td><span class="badge bg">'+fS(d.tanggal)+'</span></td>'+
        '<td><b>'+d.penerima+'</b> orang</td><td>'+rp(d.nominal_per_paket)+'</td>'+
        '<td>'+rp(d.biaya_lain)+'</td><td style="font-size:12px;color:#aaa">'+(d.ket_biaya_lain||'-')+'</td>'+
        '<td><b>'+rp(d.total)+'</b></td></tr>';
    }
    b.innerHTML=rows;
  },function(m){ toast('Gagal: '+m,false); });
}
function chartLine(cvId,chKey,items){
  var cv=document.getElementById(cvId); if(!cv||typeof Chart==='undefined') return;
  var sorted=items.slice().sort(function(a,b){return a.tgl>b.tgl?1:-1;});
  var lb=[], vals=[];
  for(var i=0;i<sorted.length;i++){ lb.push(fS(sorted[i].tgl)); vals.push(sorted[i].val); }
  if(CH[chKey]) CH[chKey].destroy();
  CH[chKey]=new Chart(cv,{type:'line',data:{labels:lb,datasets:[{label:'Penerima',data:vals,borderColor:'#0a5c2e',backgroundColor:'rgba(10,92,46,0.1)',borderWidth:2,fill:true,tension:0.3,pointRadius:4,pointBackgroundColor:'#0a5c2e'}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true},x:{grid:{display:false}}}}});
}

    '<div class="card"><div class="chead">Form Transaksi Keuangan</div><div class="cbody">'+
    '<div class="fg2">'+
    '<div><label class="fl">Tanggal <span class="req">*</span></label><input type="date" id="ktgl" value="'+td()+'"></div>'+
    '<div><label class="fl">Jenis <span class="req">*</span></label><select id="kjenis" onchange="updKat()"><option value="">-- Pilih --</option><option value="pemasukan">Pemasukan</option><option value="pengeluaran">Pengeluaran</option></select></div>'+
    '<div><label class="fl">Kategori <span class="req">*</span></label><select id="kkat"><option value="">-- Pilih Jenis Dulu --</option></select></div>'+
    '<div><label class="fl">Jumlah <span class="req">*</span></label><div class="rpw"><span class="rppfx">Rp</span><input type="number" id="kjml" min="0" step="1000" placeholder="0"></div></div>'+
    '</div>'+
    '<div style="margin-bottom:14px"><label class="fl">Rekening Tujuan / Sumber <span class="req">*</span></label><select id="krek" onchange="showRekDetail()">'+rekOpts+'</select><div class="rek-box" id="rekDetail" style="display:none"></div></div>'+
    '<div><label class="fl">Keterangan <span class="req">*</span></label><input type="text" id="kket" maxlength="100" placeholder="Keterangan transaksi..." oninput="uCC(&quot;kket&quot;,&quot;cck&quot;,100)"><div class="cc" id="cck">0/100</div></div>'+

function showRekDetail(){
  var rek=document.getElementById('krek').value;
  var box=document.getElementById('rekDetail');
  if(rek){ box.style.display='block'; box.textContent='Rekening: '+rek; }
  else { box.style.display='none'; }
}
function updKat(){
  var j=document.getElementById('kjenis').value, kat=document.getElementById('kkat');
  kat.innerHTML='<option value="">-- Pilih Kategori --</option>';
  var list=j==='pemasukan'?KAT_IN:j==='pengeluaran'?KAT_OUT:[];
  for(var i=0;i<list.length;i++) kat.innerHTML+='<option value="'+list[i]+'">'+list[i]+'</option>';
}
function rstKeu(){
  ['ktgl','kjenis','kkat','krek','kjml','kket'].forEach(function(id){var el=document.getElementById(id);if(el)el.value=id==='ktgl'?td():'';});
  var cc=document.getElementById('cck');if(cc){cc.textContent='0/100';cc.className='cc';}
  var rd=document.getElementById('rekDetail');if(rd)rd.style.display='none';
}
function draftKeu(){
  var tgl=document.getElementById('ktgl').value,jenis=document.getElementById('kjenis').value,
      kat=document.getElementById('kkat').value,jml=document.getElementById('kjml').value,
      rek=document.getElementById('krek').value,ket=document.getElementById('kket').value.trim();
  if(!tgl||!jenis||!kat||!jml||!rek||!ket){ toast('Lengkapi semua field wajib!',false); return; }
  document.getElementById('draftT').innerHTML=
    '<tr><td>Tanggal</td><td>'+fL(tgl)+'</td></tr>'+
    '<tr><td>Jenis</td><td>'+(jenis==='pemasukan'?'Pemasukan':'Pengeluaran')+'</td></tr>'+
    '<tr><td>Kategori</td><td>'+kat+'</td></tr>'+
    '<tr><td>Rekening</td><td style="font-size:12px">'+rek+'</td></tr>'+
    '<tr><td>Jumlah</td><td><b>'+rp(jml)+'</b></td></tr>'+
    '<tr><td>Keterangan</td><td>'+ket+'</td></tr>';
  PEND={type:'keu',tanggal:tgl,jenis:jenis,kategori:kat,rekening:rek,jumlah:Number(jml),keterangan:ket,dicatat_oleh:CU.name}; openM();
}
function pgBendumLap(el){
  var curY=new Date().getFullYear(), MN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  var mOpts=''; for(var i=0;i<MN.length;i++) mOpts+='<option value="'+(i+1)+'">'+MN[i]+'</option>';
  el.innerHTML='<div class="ph"><h2>Laporan Keuangan</h2><p>Rekap pemasukan dan pengeluaran kas masjid</p></div>'+
    '<div id="kStat">'+SK(3)+'</div>'+
    '<div class="card" style="margin-top:14px"><div class="chead">Tabel Transaksi<div class="fbr">'+
    '<div><label class="fl" style="margin-bottom:3px">Bulan</label><select id="kfmon" onchange="loadKeu()"><option value="">Semua</option>'+mOpts+'</select></div>'+
    '<div><label class="fl" style="margin-bottom:3px">Tahun</label><select id="kfyr" onchange="loadKeu()"><option value="">Semua</option><option value="'+curY+'">'+curY+'</option><option value="'+(curY-1)+'">'+(curY-1)+'</option></select></div>'+
    '<div><label class="fl" style="margin-bottom:3px">Jenis</label><select id="kfjenis" onchange="loadKeu()"><option value="">Semua</option><option value="pemasukan">Pemasukan</option><option value="pengeluaran">Pengeluaran</option></select></div>'+
    '</div></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>#</th><th>Tanggal</th><th>Jenis</th><th>Kategori</th><th>Rekening</th><th>Keterangan</th><th>Jumlah</th><th>Saldo</th></tr></thead>'+
    '<tbody id="kTb"><tr><td colspan="8">'+SK(2)+'</td></tr></tbody></table></div></div>';
  loadKeuStat(); loadKeu();
}
function loadKeuStat(){
  gasCall('getKeuanganSummary',[],function(r){
    var el=document.getElementById('kStat'); if(!el) return;
    el.innerHTML='<div class="ibxrow"><div class="ibx ibx-b"><div class="ibxlbl">Total Pemasukan</div><div class="ibxval">'+rp(r.totalMasuk||0)+'</div></div>'+
      '<div class="ibx ibx-r"><div class="ibxlbl">Total Pengeluaran</div><div class="ibxval">'+rp(r.totalKeluar||0)+'</div></div>'+
      '<div class="ibx ibx-g"><div class="ibxlbl">Saldo Akhir</div><div class="ibxval">'+rp(r.saldoAkhir||0)+'</div></div></div>';
  },function(){});
}
function loadKeu(){
  var mE=document.getElementById('kfmon'), yE=document.getElementById('kfyr'), jE=document.getElementById('kfjenis'), f={};
  if(mE&&mE.value) f.bulan=Number(mE.value); if(yE&&yE.value) f.tahun=Number(yE.value); if(jE&&jE.value) f.jenis=jE.value;
  gasCall('getKeuangan',[f],function(res){
    var data=res.data||[], b=document.getElementById('kTb'); if(!b) return;
    if(!data.length){ b.innerHTML='<tr><td colspan="8" style="text-align:center;padding:30px;color:#aaa">Belum ada data.</td></tr>'; return; }
    var rows=''; for(var i=0;i<data.length;i++){
      var d=data[i], isMsk=d.jenis==='pemasukan';
      rows+='<tr><td>'+(i+1)+'</td><td><span class="badge bg">'+fS(d.tanggal)+'</span></td>'+
        '<td><span class="badge '+(isMsk?'bb':'br')+'">'+(isMsk?'Masuk':'Keluar')+'</span></td>'+
        '<td>'+d.kategori+'</td>'+
        '<td style="font-size:11px;color:#1a4a8a">'+(d.rekening||'-')+'</td>'+
        '<td style="font-size:12px;color:#555">'+d.keterangan+'</td>'+
        '<td style="font-weight:700;color:'+(isMsk?'#1a4a8a':'#c0392b')+'">'+rp(d.jumlah)+'</td>'+
        '<td style="font-weight:700">'+rp(d.saldo)+'</td></tr>';
    }
    b.innerHTML=rows;
  },function(m){ toast('Gagal: '+m,false); });
}

function saveBudget(){
  var total=Number(document.getElementById('abud').value),ket=document.getElementById('abet').value.trim();
  if(!total){ toast('Masukkan jumlah budget!',false); return; }
  var btn=document.getElementById('btnBud'); btn.disabled=true; btn.textContent='Menyimpan...';
  gasCall('saveBudgetAdmin',[total,ket,CU.name],function(){
    btn.disabled=false; btn.textContent='Simpan Budget';
    document.getElementById('abcur').textContent=rp(total); toast('Budget berhasil disimpan!',true);
  },function(m){ btn.disabled=false; btn.textContent='Simpan Budget'; toast('Gagal: '+m,false); });
}
