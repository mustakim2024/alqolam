<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f4f4f0;color:#111;min-height:100vh}
#loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0a5c2e,#1a7a42)}
.lbox{background:#fff;border-radius:20px;padding:44px 40px;width:380px;max-width:94vw;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.llogo{text-align:center;margin-bottom:28px}
.lring{width:96px;height:96px;border-radius:50%;border:3px solid #c9981a;overflow:hidden;margin:0 auto 12px;background:#fff;display:flex;align-items:center;justify-content:center}
.lring img{width:92px;height:92px;object-fit:cover;border-radius:50%;display:block}
.lname{font-family:'Cinzel',serif;font-size:21px;font-weight:700;color:#0a5c2e;letter-spacing:3px}
.lver{font-size:12px;color:#c9981a;font-weight:700;letter-spacing:4px;margin-top:3px}
.ltag{font-size:12px;color:#999;font-weight:700;color:#0a5c2e;margin-bottom:32px;text-align:center}
.lbl{display:block;font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.8px;margin:14px 0 6px}
.finp{width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;color:#111;background:#fafaf6}
.finp:focus{outline:none;border-color:#0a5c2e}
.btnlogin{width:100%;margin-top:18px;padding:13px;background:#0a5c2e;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.btnlogin:hover{background:#1a7a42}.btnlogin:disabled{background:#999;cursor:not-allowed}
#msgbox{border-radius:8px;font-size:13px;padding:10px 13px;margin-top:10px;display:none;word-break:break-all}
.merr{background:#fff0ee;border:1px solid #f5c6c0;color:#c0392b}
.mok{background:#f0fff4;border:1px solid #b7ebc8;color:#0a5c2e}
.minf{background:#e8f4ff;border:1px solid #90cdf4;color:#1a4a8a}
.lfoot{text-align:center;margin-top:18px;font-size:11px;color:#bbb;line-height:1.8}
#appShell{display:none;flex-direction:column;min-height:100vh}
.hdr{background:#0a5c2e;height:56px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.25);gap:8px}
.hbrand{display:flex;align-items:center;gap:8px;flex-shrink:0;min-width:0}
.hlogo{width:36px;height:36px;border-radius:50%;overflow:hidden;background:#fff;border:2px solid #c9981a;flex-shrink:0}
.hlogo img{width:100%;height:100%;object-fit:cover;display:block}
.htitle{font-family:'Cinzel',serif;font-size:14px;font-weight:700;color:#fff;letter-spacing:1px;white-space:nowrap}
.hver{font-size:9px;color:#f5d060;letter-spacing:1px}
.hright{display:flex;align-items:center;gap:6px;flex-shrink:0}
.huser{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.9);font-size:12px}
.hnm{white-space:nowrap;max-width:60px;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.ava{width:28px;height:28px;border-radius:50%;background:#c9981a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#0a5c2e;flex-shrink:0}
.boutbtn{padding:5px 10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:16px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif}
.boutbtn:hover{background:rgba(255,255,255,.22)}
.boutbtn-red{background:rgba(205,92,92,.25);border-color:rgba(205,92,92,.6);color:#ffb3b3}
.boutbtn-red:hover{background:#CD5C5C;color:#fff;border-color:#CD5C5C}
@media(max-width:400px){.htitle{font-size:12px}.hnm{max-width:44px}}
.nav{background:#fff;border-bottom:2px solid #e0e0e0;display:flex;padding:0 20px;overflow-x:auto}
.ntab{padding:12px 18px;font-size:13px;font-weight:700;color:#999;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.ntab:hover{color:#0a5c2e}.ntab.on{color:#0a5c2e;border-bottom-color:#c9981a}
.appmain{flex:1;padding:22px;max-width:1060px;margin:0 auto;width:100%;background:#f4f4f0;min-height:500px}
.pg{display:none}.pg.on{display:block}
.ph{margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid #ddd}
.ph h2{font-size:18px;font-weight:700;color:#0a5c2e}.ph p{font-size:13px;color:#999;margin-top:3px}
.card{background:#fff;border-radius:10px;border:1px solid #e0e0e0;margin-bottom:18px;overflow:hidden}
.chead{padding:14px 20px;border-bottom:1px solid #e0e0e0;background:#f8f8f5;font-weight:700;color:#0a5c2e;font-size:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.cbody{padding:20px}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.fl{display:block;font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.req{color:red}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:10px 13px;border:1.5px solid #ccc;border-radius:7px;font-size:14px;font-family:'Inter',sans-serif}
input:focus,select:focus,textarea:focus{outline:none;border-color:#0a5c2e}
.cc{font-size:11px;color:#aaa;text-align:right;margin-top:2px}.cc.warn{color:red}
.rpw{position:relative}.rppfx{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:700;color:#666;pointer-events:none}
.rpw input{padding-left:32px}
.act{display:flex;gap:10px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.btnp{padding:10px 20px;background:#0a5c2e;color:#fff;border:none;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer}
.btnp:hover{background:#1a7a42}.btnp:disabled{background:#999;cursor:not-allowed}
.btno{padding:10px 20px;background:transparent;border:1.5px solid #0a5c2e;color:#0a5c2e;border-radius:7px;font-size:14px;font-weight:700;cursor:pointer}
.btno:hover{background:#0a5c2e;color:#fff}
.divhr{height:1px;background:#eee;margin:16px 0}
.sesi-hd{font-size:13px;font-weight:700;color:#fff;padding:8px 14px;border-radius:6px;margin-bottom:10px}
.sesi-pagi{background:#1a4a8a}.sesi-sore{background:#c9981a}
.clsec{background:#f4f4f0;border-radius:8px;padding:14px;margin-bottom:12px}
.clttl{font-size:13px;font-weight:700;color:#0a5c2e;margin-bottom:10px}
.clgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.ci.on{border-color:#0a5c2e;background:rgba(10,92,46,.06);color:#0a5c2e;font-weight:700}
.cbox{width:18px;height:18px;border:2px solid #ccc;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:transparent}
.ci.on .cbox{background:#0a5c2e;border-color:#0a5c2e;color:#fff}
.ci-libur{border-color:#c0392b!important;background:rgba(192,57,43,.06)!important;color:#c0392b!important;font-weight:700}
.ci-libur .cbox{background:#c0392b!important;border-color:#c0392b!important;color:#fff!important}

.mover.on{display:flex}
.mbox{background:#fff;border-radius:14px;max-width:500px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
.mhd{background:#0a5c2e;padding:15px 20px;color:#fff;font-size:14px;font-weight:700}
.mbd{padding:20px}.mbd p{font-size:13px;color:#555;margin-bottom:12px}
.dtbl{width:100%;border-collapse:collapse}

.dtbl td:first-child{font-weight:700;color:#555;width:38%;background:#f8f8f5}
.mft{padding:13px 20px;border-top:1px solid #eee;display:flex;gap:10px;justify-content:flex-end}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{padding:10px 12px;text-align:left;font-size:10px;font-weight:700;color:#0a5c2e;text-transform:uppercase;letter-spacing:.7px;border-bottom:2px solid #c9981a;background:#f4f4f0}
.tbl td{padding:9px 12px;border-bottom:1px solid #eee;vertical-align:middle}
.tbl tr:hover td{background:rgba(10,92,46,.025)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
.bg{background:rgba(10,92,46,.12);color:#0a5c2e}.bo{background:rgba(201,152,26,.15);color:#8b6914}
.bw{background:#eee;color:#777}.bb{background:rgba(26,74,138,.12);color:#1a4a8a}
.br{background:rgba(192,57,43,.12);color:#c0392b}.blibur{background:#f5c6c0;color:#c0392b}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.sc{background:#fff;border-radius:10px;padding:16px;border:1px solid #e0e0e0;border-right:4px solid #c9981a}
.sl{font-size:10px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.sv{font-size:22px;font-weight:700;color:#0a5c2e;line-height:1;margin-bottom:3px}
.sss{font-size:11px;color:#aaa}
.ibxrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;margin-bottom:4px}
.ibx{border-radius:10px;padding:18px 20px;color:#fff;flex:1;min-width:130px}
.ibx-g{background:#0a5c2e}.ibx-b{background:#1a4a8a}.ibx-r{background:#7b1a1a}.ibx-v{background:#4a235a}
.ibxlbl{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,.6);margin-bottom:3px}
.ibxval{font-size:20px;font-weight:700;color:#f5d060}
.chw{background:#fff;border-radius:10px;padding:20px;border:1px solid #e0e0e0;margin-top:16px}
.smg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:18px}
.smc{background:#fff;border-radius:10px;border:1px solid #e0e0e0;overflow:hidden}
.smh{padding:12px 16px;font-weight:700;font-size:13px;color:#fff}
.smh.t{background:#0a5c2e}.smh.b{background:#1a4a8a}.smh.k{background:#6b1a1a}
.smh.f{background:#4a235a}.smh.o{background:#7b4a00}
.smbd{padding:13px 16px}
.smr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;font-size:13px}
.smr:last-child{border:none}.smk{color:#666}.smv{font-weight:700;color:#0a5c2e}
.fbr{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.fbr select{max-width:120px}
.toast{position:fixed;bottom:20px;right:20px;color:#fff;padding:12px 16px;border-radius:7px;font-size:13px;font-weight:700;z-index:2000;display:none;max-width:300px}
.toast.on{display:block}.tok{background:#0a5c2e}.terr{background:#c0392b}
.btnhps{padding:4px 10px;background:#c0392b;color:#fff;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer}
.btnhps:hover{background:#a93226}

.rek-box{background:#f0f7ff;border:1px solid #90cdf4;border-radius:7px;padding:10px 13px;font-size:12px;color:#1a4a8a;margin-top:6px;line-height:1.6}
.tag-confirmed{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:700;background:rgba(10,92,46,.12);color:#0a5c2e}
.tag-unconfirmed{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:700;background:rgba(192,57,43,.12);color:#c0392b}
.jenis-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.jenis-tab{padding:8px 18px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid #ddd;color:#999;background:#fff}
.jenis-tab.on{background:#0a5c2e;color:#fff;border-color:#0a5c2e}
.info-box{background:#e8f4ff;border:.5px solid #90cdf4;border-radius:8px;padding:10px 14px;font-size:12px;color:#1a4a8a;margin-bottom:14px}
.btn-confirm{padding:4px 8px;background:rgba(10,92,46,.12);color:#0a5c2e;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;margin-right:3px}
.btn-unconfirm{padding:4px 8px;background:rgba(201,152,26,.15);color:#8b6914;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer;margin-right:3px}
.btn-confirm:hover{background:#0a5c2e;color:#fff}.btn-unconfirm:hover{background:#c9981a;color:#fff}

.tag-unconfirmed{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;background:rgba(192,57,43,.12);color:#c0392b}

// ---- API CALL via fetch GET ----
var GAS_API = "https://script.google.com/macros/s/AKfycbzxiL4gxUDfUoS8IGcOcRnVTOwvXYEYssP593aGpDhB2o09SXLf176hHyQviLvegmKD/exec";

function gasCall(fn, args, onOk, onErr) {
  var payload = encodeURIComponent(JSON.stringify({ fn: fn, args: args || [] }));
  var url = GAS_API + '?payload=' + payload;
  fetch(url, { method: 'GET', redirect: 'follow' })
    .then(function(resp) { return resp.json(); })
    .then(function(r) {
      if (r && r.ok === false) { if (onErr) onErr(r.msg || 'Error'); }
      else { if (onOk) onOk(r); }
    })
    .catch(function(e) {
      if (onErr) onErr('Fetch error: ' + String(e));
    });
}

// ---- OFFLINE ----
function filterArr(arr,f){
  if(!f) return arr;
  return arr.filter(function(d){
    var tgl=d.tanggal||'';
    if(f.bulan&&(new Date(tgl).getMonth()+1)!=f.bulan) return false;
    if(f.tahun&&new Date(tgl).getFullYear()!=f.tahun) return false;
    return true;
  });
}
function offlineCall(fn,args,ok,err){

    case 'saveTabuk':{ var a=L('tabuk_data',[]); args[0].id='TBK-'+Date.now(); args[0].ts=new Date().toISOString(); a.push(args[0]); S('tabuk_data',a); ok({ok:true}); break; }
    case 'saveKebersihan':{ var a=L(args[0]+'_data',[]); args[1].ts=new Date().toISOString(); a.push(args[1]); S(args[0]+'_data',a); ok({ok:true}); break; }
    case 'saveOjol':{ var a=L('ojol_data',[]); var d=args[0]; d.id='OJL-'+Date.now(); d.ts=new Date().toISOString(); d.total=(+d.nominal_per_paket*+d.penerima)+(+d.biaya_lain); a.push(d); S('ojol_data',a); ok({ok:true}); break; }
    case 'saveKeuangan':{ var a=L('keuangan',[]); var last=a.length?Number(a[a.length-1].saldo):0; var jml=Number(args[0].jumlah); var sal=args[0].jenis==='pemasukan'?last+jml:last-jml; args[0].saldo=sal; args[0].id='KAU-'+Date.now(); args[0].ts=new Date().toISOString(); a.push(args[0]); S('keuangan',a); ok({ok:true,saldo:sal}); break; }
    case 'getTabuk':    ok({ok:true,data:filterArr(L('tabuk_data',[]).reverse(),args[0])}); break;
    case 'getKebersihan': ok({ok:true,data:filterArr(L(args[0]+'_data',[]).reverse(),args[1])}); break;
    case 'getOjol':     ok({ok:true,data:filterArr(L('ojol_data',[]).reverse(),args[0])}); break;
    case 'getKeuangan':{ var d=filterArr(L('keuangan',[]).reverse(),args[0]); if(args[0]&&args[0].jenis)d=d.filter(function(x){return x.jenis===args[0].jenis;}); ok({ok:true,data:d}); break; }
    case 'getBudget':   var bg=L('budget',{total:0,keterangan:''}); bg.ok=true; ok(bg); break;
    case 'saveBudgetAdmin': S('budget',{total:args[0],keterangan:args[1]}); ok({ok:true}); break;
    case 'getKeuanganSummary':{ var a=L('keuangan',[]); var msk=0,klr=0,sal=a.length?Number(a[a.length-1].saldo):0; for(var i=0;i<a.length;i++){if(a[i].jenis==='pemasukan')msk+=Number(a[i].jumlah);else klr+=Number(a[i].jumlah);} ok({ok:true,totalMasuk:msk,totalKeluar:klr,saldoAkhir:sal}); break; }
    case 'getAdminSummary':{ var a=L('keuangan',[]); var msk=0,klr=0,sal=a.length?Number(a[a.length-1].saldo):0; for(var i=0;i<a.length;i++){if(a[i].jenis==='pemasukan')msk+=Number(a[i].jumlah);else klr+=Number(a[i].jumlah);} ok({ok:true,tabuk:L('tabuk_data',[]).reverse(),badar:L('badar_data',[]).reverse(),khandaq:L('khandaq_data',[]).reverse(),ojol:L('ojol_data',[]).reverse(),budget:L('budget',{total:0,keterangan:''}),keuangan:{totalMasuk:msk,totalKeluar:klr,saldoAkhir:sal}}); break; }
    case 'saveResq':   { var a=L('resq_data',[]); args[0].id='RSQ-'+Date.now(); args[0].ts=new Date().toISOString(); a.push(args[0]); S('resq_data',a); ok({ok:true}); break; }
    case 'getResq':    ok({ok:true,data:L('resq_data',[]).reverse()}); break;
    case 'saveDakwah': { var a=L('dakwah_data',[]); args[0].id='DKW-'+Date.now(); args[0].ts=new Date().toISOString(); a.push(args[0]); S('dakwah_data',a); ok({ok:true}); break; }

  var nav=document.getElementById('navEl'); nav.innerHTML='';
  for(var i=0;i<tabs.length;i++){
    (function(idx){
      var el=document.createElement('div'); el.className='ntab'+(idx===0?' on':''); el.textContent=tabs[idx].l;
      el.addEventListener('click',function(){ nav.querySelectorAll('.ntab').forEach(function(t,j){t.classList.toggle('on',j===idx);}); document.querySelectorAll('.pg').forEach(function(p,j){p.classList.toggle('on',j===idx);}); });
      nav.appendChild(el);
    })(i);
  }
  var mainEl=document.getElementById('mainEl'); mainEl.innerHTML='';
  for(var j=0;j<pages.length;j++){ var div=document.createElement('div'); div.className='pg'+(j===0?' on':''); div.id='pg'+j; mainEl.appendChild(div); }
  // Render only first page on load; others render on tab click

}

function chartBar(cvId, chKey, items){

function chartLine(cvId,chKey,items){
  var cv=document.getElementById(cvId); if(!cv||typeof Chart==='undefined') return;
  var sorted=items.slice().sort(function(a,b){return a.tgl>b.tgl?1:-1;});
  var lb=[], vals=[];
  for(var i=0;i<sorted.length;i++){ lb.push(fS(sorted[i].tgl)); vals.push(sorted[i].val); }
  if(CH[chKey]) CH[chKey].destroy();
  CH[chKey]=new Chart(cv,{type:'line',data:{labels:lb,datasets:[{label:'Penerima',data:vals,borderColor:'#0a5c2e',backgroundColor:'rgba(10,92,46,0.1)',borderWidth:2,fill:true,tension:0.3,pointRadius:4,pointBackgroundColor:'#0a5c2e'}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true},x:{grid:{display:false}}}}});
}

// ================================================================
//  HELPER: makeEl - create element without innerHTML template
// ================================================================
function makeEl(tag, attrs, text) {
  var el = document.createElement(tag);
  if (attrs) {
    for (var k in attrs) {
      if (k === 'className') el.className = attrs[k];
      else if (k === 'textContent') el.textContent = attrs[k];
      else if (k === 'innerHTML') el.innerHTML = attrs[k];
      else if (k === 'onclick') el.onclick = attrs[k];
      else el.setAttribute(k, attrs[k]);
    }
  }
  if (text !== undefined) el.textContent = text;
  return el;
}

function mkInput(id, type, placeholder, val) {
  var inp = document.createElement('input');
  inp.type = type || 'text';
  inp.id = id;
  if (placeholder) inp.placeholder = placeholder;
  if (val !== undefined) inp.value = val;
  return inp;
}

function mkLabel(txt, req) {
  var l = document.createElement('label');
  l.className = 'fl';
  l.innerHTML = txt + (req ? ' <span class="req">*</span>' : '');
  return l;
}

function mkFg2() { var d = document.createElement('div'); d.className = 'fg2'; return d; }
function mkFgItem() { var d = document.createElement('div'); return d; }
function mkCard(head, bodyFn) {
  var card = document.createElement('div'); card.className = 'card';
  var ch = document.createElement('div'); ch.className = 'chead'; ch.textContent = head;
  var cb = document.createElement('div'); cb.className = 'cbody';
  card.appendChild(ch); card.appendChild(cb);
  if (bodyFn) bodyFn(cb);
  return card;
}

function mkPh(title, sub) {
  var div = document.createElement('div'); div.className = 'ph';
  var h2 = document.createElement('h2'); h2.textContent = title;
  var p = document.createElement('p'); p.textContent = sub;
  div.appendChild(h2); div.appendChild(p);
  return div;
}

function mkSelect(id, options) {
  var sel = document.createElement('select'); sel.id = id;
  for (var i = 0; i < options.length; i++) {
    var opt = document.createElement('option');
    opt.value = options[i].v || '';
    opt.textContent = options[i].t;
    sel.appendChild(opt);
  }
  return sel;
}

function mkRpInput(id) {
  var wrap = document.createElement('div'); wrap.className = 'rpw';
  var pfx = document.createElement('span'); pfx.className = 'rppfx'; pfx.textContent = 'Rp';
  var inp = document.createElement('input'); inp.type = 'number'; inp.id = id; inp.min = '0'; inp.step = '1000'; inp.placeholder = '0';
  wrap.appendChild(pfx); wrap.appendChild(inp);
  return wrap;
}

function mkBtn(cls, txt, fn) {
  var b = document.createElement('button'); b.className = cls; b.textContent = txt; b.onclick = fn; return b;
}

function mkAct() { var d = document.createElement('div'); d.className = 'act'; return d; }

function addFgRow(fg, items) {
  for (var i = 0; i < items.length; i++) {
    var wrap = document.createElement('div');
    if (items[i].label !== undefined) {
      wrap.appendChild(mkLabel(items[i].label, items[i].req));
    }
    if (items[i].el) wrap.appendChild(items[i].el);
    fg.appendChild(wrap);
  }
}

    var e = document.getElementById(ids[i]);
    if (e) e.value = ids[i] === role+'_tgl' ? td() : '';

function buildKegMon(el, role, label, getFn) {
  var curY=new Date().getFullYear();
  var MN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  var mOpts=[{v:'',t:'Semua'}]; for(var i=0;i<12;i++) mOpts.push({v:''+(i+1),t:MN[i]});
  var yOpts=[{v:'',t:'Semua'}]; for(var y=curY;y>=curY-2;y--) yOpts.push({v:''+y,t:''+y});

  el.innerHTML = '';
  el.appendChild(mkPh('Rekap Kegiatan - '+label, 'Riwayat dan statistik kegiatan'));

  var statDiv = document.createElement('div'); statDiv.id = role+'_stat'; statDiv.innerHTML = SK(3);
  el.appendChild(statDiv);

  var chw = document.createElement('div'); chw.className = 'chw';
  chw.innerHTML = '<b style="font-size:13px;color:#0a5c2e">Grafik Kegiatan per Bulan</b><div style="margin-top:12px"><canvas id="ch_'+role+'" height="80"></canvas></div>';
  el.appendChild(chw);

  var divhr = document.createElement('div'); divhr.className = 'divhr';
  el.appendChild(divhr);

  var card = document.createElement('div'); card.className = 'card';
  var selFm = mkSelect(role+'_fm', mOpts);
  var selFy = mkSelect(role+'_fy', yOpts);
  selFm.onchange = function(){ loadKeg2(role, getFn); };
  selFy.onchange = function(){ loadKeg2(role, getFn); };

  card.innerHTML = '<div class="chead">Tabel Riwayat<div class="fbr"><div><label class="fl" style="margin-bottom:3px">Bulan</label></div><div><label class="fl" style="margin-bottom:3px">Tahun</label></div></div></div>'+
    '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>#</th><th>Tanggal</th><th>Waktu</th><th>Nama Kegiatan</th><th>Tempat</th><th>Peserta</th><th>Anggaran</th><th>Catatan</th></tr></thead>'+
    '<tbody id="'+role+'_tb"><tr><td colspan="8">'+SK(2)+'</td></tr></tbody></table></div>';

  // Insert selects into the filter bar
  var fbItems = card.querySelectorAll('.fbr > div');
  if(fbItems[0]) fbItems[0].appendChild(selFm);
  if(fbItems[1]) fbItems[1].appendChild(selFy);
  el.appendChild(card);
  loadKeg2(role, getFn);
}

function loadKeg2(role, getFn) {
  var mE=document.getElementById(role+'_fm'), yE=document.getElementById(role+'_fy'), f={};
  if(mE&&mE.value) f.bulan=Number(mE.value);
  if(yE&&yE.value) f.tahun=Number(yE.value);
  gasCall(getFn,[f],function(res){
    var data=res.data||[], totP=0, totA=0;
    for(var i=0;i<data.length;i++){ totP+=Number(data[i].peserta)||0; totA+=Number(data[i].anggaran)||0; }
    var st=document.getElementById(role+'_stat');
    if(st) st.innerHTML='<div class="sg">'+
      '<div class="sc"><div class="sl">Total Kegiatan</div><div class="sv">'+data.length+'</div><div class="sss">kegiatan</div></div>'+
      '<div class="sc"><div class="sl">Total Peserta</div><div class="sv">'+totP.toLocaleString('id-ID')+'</div><div class="sss">orang</div></div>'+
      '<div class="sc"><div class="sl">Total Anggaran</div><div class="sv" style="font-size:16px">'+rp(totA)+'</div><div class="sss">terpakai</div></div></div>';
    var P={};
    for(var i=0;i<data.length;i++){
      var dt=new Date(data[i].tanggal);
      var mn=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'][dt.getMonth()];
      var k=dt.getFullYear()+'-'+(dt.getMonth()+1);
      if(!P[k]) P[k]={count:0,lbl:mn+' '+dt.getFullYear()};
      P[k].count++;
    }
    var keys=Object.keys(P).sort(), lb=[], vals=[];
    for(var j=0;j<keys.length;j++){ lb.push(P[keys[j]].lbl); vals.push(P[keys[j]].count); }
    var cv=document.getElementById('ch_'+role);
    if(cv&&typeof Chart!=='undefined'){
      if(CH['kk_'+role]) CH['kk_'+role].destroy();
      CH['kk_'+role]=new Chart(cv,{type:'line',data:{labels:lb,datasets:[{label:'Kegiatan',data:vals,borderColor:'#0a5c2e',backgroundColor:'rgba(10,92,46,0.08)',borderWidth:2,fill:true,tension:0.3,pointRadius:4,pointBackgroundColor:'#0a5c2e'}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}},x:{grid:{display:false}}}}});
    }
    var b=document.getElementById(role+'_tb'); if(!b) return;
    if(!data.length){ b.innerHTML='<tr><td colspan="8" style="text-align:center;padding:30px;color:#aaa">Belum ada data.</td></tr>'; return; }
    var rows='';
    for(var i=0;i<data.length;i++){
      var d=data[i];
      rows+='<tr><td>'+(i+1)+'</td><td><span class="badge bg">'+fS(d.tanggal)+'</span></td>'+
        '<td style="white-space:nowrap">'+(d.waktu_start||'-')+' - '+(d.waktu_stop||'-')+' WIB</td>'+
        '<td>'+d.nama_kegiatan+'</td><td>'+d.tempat+'</td>'+
        '<td>'+d.peserta+'</td><td>'+rp(d.anggaran)+'</td>'+
        '<td style="font-size:12px;color:#aaa">'+(d.catatan||'-')+'</td></tr>';
    }
    b.innerHTML=rows;
  },function(m){ toast('Gagal: '+m,false); });
}

function pgRuanganJadwal(el) { renderJadwal(el,false); }

function renderJadwal(el, isAdmin) {
  var curY=new Date().getFullYear();
  var MN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  var mOpts=[{v:'',t:'Semua'}]; for(var i=0;i<12;i++) mOpts.push({v:''+(i+1),t:MN[i]});
  var yOpts=[{v:'',t:'Semua'}]; for(var y=curY;y>=curY-1;y--) yOpts.push({v:''+y,t:''+y});

  if(el) {
    el.innerHTML='';
    el.appendChild(mkPh('Status Pemesanan Ruang Masjid','Semua pemesanan ruangan masjid'));

    var card = document.createElement('div'); card.className='card';
    var selFm = mkSelect('rng_fm', mOpts);
    var selFy = mkSelect('rng_fy', yOpts);
    selFm.onchange = function(){ doLoadJadwal(isAdmin); };
    selFy.onchange = function(){ doLoadJadwal(isAdmin); };

    var cols = isAdmin ? 8 : 7;
    var extraTh = isAdmin ? '<th>Aksi</th>' : '';
    card.innerHTML='<div class="chead">Tabel Jadwal<div class="fbr">'+
      '<div><label class="fl" style="margin-bottom:3px">Bulan</label></div>'+
      '<div><label class="fl" style="margin-bottom:3px">Tahun</label></div>'+
      '</div></div>'+
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr>'+
      '<th>#</th><th>Tanggal</th><th>Waktu</th><th>Lantai</th><th>Kegiatan / Pengirim</th><th>PJ / HP</th><th>Status</th>'+extraTh+
      '</tr></thead><tbody id="rng_tb"><tr><td colspan="'+cols+'">'+SK(2)+'</td></tr></tbody></table></div>';

    var fbItems = card.querySelectorAll('.fbr > div');
    if(fbItems[0]) fbItems[0].appendChild(selFm);
    if(fbItems[1]) fbItems[1].appendChild(selFy);
    el.appendChild(card);
  }
  doLoadJadwal(isAdmin);
}

function doLoadJadwal(isAdmin) {
  var mE=document.getElementById('rng_fm'), yE=document.getElementById('rng_fy'), f={};
  if(mE&&mE.value) f.bulan=Number(mE.value);
  if(yE&&yE.value) f.tahun=Number(yE.value);
  var cols=isAdmin?8:7;
  gasCall('getRuangan',[f],function(res){
    var data=res.data||[], b=document.getElementById('rng_tb'); if(!b) return;
    if(!data.length){ b.innerHTML='<tr><td colspan="'+cols+'" style="text-align:center;padding:30px;color:#aaa">Belum ada pemesanan.</td></tr>'; return; }
    var rows='';
    for(var i=0;i<data.length;i++){
      var d=data[i];
      var stTag=d.status==='CONFIRMED'?
        '<span class="tag-confirmed">CONFIRMED</span>':
        '<span class="tag-unconfirmed">UNCONFIRMED</span>';
      var aksi='';
      if(isAdmin){
        aksi='<td>'+
          '<button class="btn-confirm" onclick="ubahStsRng(\''+d.id+'\',\'CONFIRMED\')">OK</button>'+
          '<button class="btn-unconfirm" onclick="ubahStsRng(\''+d.id+'\',\'UNCONFIRMED\')">Batal</button>'+
          '<button class="btnhps" onclick="hapusRng(\''+d.id+'\')">Hapus</button>'+
          '</td>';
      }
      rows+='<tr>'+
        '<td>'+(i+1)+'</td>'+
        '<td><span class="badge bg">'+fS(d.tanggal)+'</span></td>'+
        '<td style="white-space:nowrap">'+d.waktu_start+' - '+d.waktu_stop+' WIB</td>'+
        '<td><span class="badge bg">'+d.lantai+'</span></td>'+
        '<td>'+d.nama_kegiatan+'<br><small style="color:#aaa;font-size:11px">'+d.submitted_by+'</small></td>'+
        '<td style="font-size:12px">'+d.pj_acara+'<br>'+d.no_hp+'</td>'+
        '<td>'+stTag+'</td>'+aksi+
        '</tr>';
    }
    b.innerHTML=rows;
  },function(m){ toast('Gagal: '+m,false); });
}

function ubahStsRng(id,status){
  gasCall('updateStatusRuangan',[id,status],
    function(){ toast('Status: '+status,true); doLoadJadwal(true); },
    function(m){ toast('Gagal: '+m,false); }
  );
}

function hapusRng(id){
  if(!confirm('Yakin hapus pemesanan ini?')) return;
  gasCall('hapusData',['ruangan_data',id],
    function(){ toast('Pemesanan dihapus',true); doLoadJadwal(true); },
    function(m){ toast('Gagal: '+m,false); }
  );
}

var MON_DATA = {};
var MON_CHART_TIM_MODE = 'bulan';

function switchChartTim(mode) {
  MON_CHART_TIM_MODE = mode;
  document.getElementById('ch_tim_bulan').className = 'jenis-tab'+(mode==='bulan'?' on':'');
  document.getElementById('ch_tim_tahun').className = 'jenis-tab'+(mode==='tahun'?' on':'');

}

function loadMonitorAll() {
  var fy = document.getElementById('mon_fy'); var fm = document.getElementById('mon_fm');
  var f = {};
  if(fy&&fy.value) f.tahun = Number(fy.value);
  if(fm&&fm.value) f.bulan = Number(fm.value);

  var st = document.getElementById('mon_stat');
  if(st) st.innerHTML = SK(5);

  gasCall('getMonitorSummary',[f],function(res){
    if(!res.ok){ toast('Gagal: '+(res.msg||''), false); return; }
    MON_DATA = res;

    var MN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];

    // ---- SUMMARY CARDS ----
    var totalKeg = (res.resq||[]).length + (res.dakwah||[]).length + (res.sarpras||[]).length;
    var totP=0;
    ['resq','dakwah','sarpras'].forEach(function(k){ (res[k]||[]).forEach(function(d){ totP+=Number(d.peserta)||0; }); });
    var rngConf = (res.ruangan||[]).filter(function(d){ return d.status==='CONFIRMED'; }).length;
    var masuk=0, keluar=0;
    (res.keuangan||[]).forEach(function(d){ if(d.jenis==='pemasukan') masuk+=Number(d.jumlah)||0; else keluar+=Number(d.jumlah)||0; });

      '<div class="sc"><div class="sl">Jumat Berkah</div><div class="sv">'+(res.tabuk||[]).length+'</div><div class="sss">laporan</div></div>'+
      '<div class="sc"><div class="sl">Total Kegiatan</div><div class="sv">'+totalKeg+'</div><div class="sss">kegiatan</div></div>'+
      '<div class="sc"><div class="sl">Total Peserta</div><div class="sv">'+totP.toLocaleString('id-ID')+'</div><div class="sss">orang</div></div>'+
      '<div class="sc"><div class="sl">Ruangan Confirmed</div><div class="sv">'+rngConf+'</div><div class="sss">pemesanan</div></div>'+
      '<div class="sc"><div class="sl">Saldo Keuangan</div><div class="sv" style="font-size:14px">'+(res.keuanganSum?rp(res.keuanganSum.saldoAkhir):'-')+'</div><div class="sss">saldo</div></div>'+
      '</div>';

    renderChartTim(res);
    renderChartRuangan(res);
    renderMonitorTables(res);
    setTimeout(reloadKeuPerkan, 100);
  }, function(m){ toast('Gagal load: '+m, false); });
}

function renderChartTim(res) {
  var MN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  var mode = MON_CHART_TIM_MODE;

  function groupData(arr, field) {
    var P = {};
    (arr||[]).forEach(function(d){
      var dt = new Date(d.tanggal);
      var k = mode==='bulan' ? (dt.getFullYear()+'-'+(dt.getMonth()+1)) : (''+dt.getFullYear());
      P[k] = (P[k]||0)+1;
    });
    return P;
  }

  var datasets = [
    {label:'Jumat Berkah', data:groupData(res.tabuk),   color:'#0a5c2e'},
    {label:'Ojol',         data:groupData(res.ojol),    color:'#4A235A'},
    {label:'Resq',         data:groupData(res.resq),    color:'#8B0000'},
    {label:'Dakwah',       data:groupData(res.dakwah),  color:'#1A5A8A'},
    {label:'Sarpras',      data:groupData(res.sarpras), color:'#5A3A1A'},
  ];

  var allKeys = {};
  datasets.forEach(function(ds){ Object.keys(ds.data).forEach(function(k){ allKeys[k]=1; }); });
  var sortedKeys = Object.keys(allKeys).sort();
  var lbls = sortedKeys.map(function(k){
    if(mode==='bulan'){ var p=k.split('-'); return MN[parseInt(p[1])-1]+' '+p[0]; }
    return k;
  });

  var cv = document.getElementById('ch_mon_tim');
  if(cv&&typeof Chart!=='undefined'){
    if(CH._mon_tim) CH._mon_tim.destroy();
    CH._mon_tim = new Chart(cv,{
      type:'bar',
      data:{
        labels:lbls,
        datasets:datasets.map(function(ds){
          return {
            label:ds.label,
            data:sortedKeys.map(function(k){return ds.data[k]||0;}),
            backgroundColor:ds.color+'bb',
            borderColor:ds.color,
            borderWidth:1
          };
        })
      },
      options:{indexAxis:'y',responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:10,padding:6}}},scales:{x:{beginAtZero:true,ticks:{stepSize:1}},y:{grid:{display:false}}}}
    });
  }
}

function renderChartRuangan(res) {
  var lantaiCount = {};
  (res.ruangan||[]).forEach(function(d){
    var l=d.lantai||'Unknown'; lantaiCount[l]=(lantaiCount[l]||0)+1;
  });
  var cv=document.getElementById('ch_mon_rng');
  if(cv&&typeof Chart!=='undefined'){
    if(CH._mon_rng) CH._mon_rng.destroy();
    if(Object.keys(lantaiCount).length===0){
      CH._mon_rng=null;
      cv.parentElement.innerHTML+='<p style="text-align:center;color:#aaa;font-size:12px;margin-top:10px">Belum ada data pemesanan</p>';
      return;
    }
    CH._mon_rng=new Chart(cv,{
      type:'doughnut',
      data:{labels:Object.keys(lantaiCount),datasets:[{data:Object.values(lantaiCount),backgroundColor:['#0a5c2e','#c9981a','#1a4a8a','#8b0000']}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}
    });
  }
}

      '<div class="card" style="margin-top:12px"><div class="chead">Ringkasan per Bulan</div>'+
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>#</th><th>Bulan</th><th>Pemasukan</th><th>Pengeluaran</th><th>Selisih</th></tr></thead>'+
      '<tbody>'+renderKeuTable('bulan',gBulan)+'</tbody></table></div></div>'+
      '<div class="card" style="margin-top:12px"><div class="chead">Ringkasan per Tahun</div>'+
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>#</th><th>Tahun</th><th>Pemasukan</th><th>Pengeluaran</th><th>Selisih</th></tr></thead>'+
      '<tbody>'+renderKeuTable('tahun',gTahun)+'</tbody></table></div></div>';

    // Render keuangan chart
    var cvk=document.getElementById('ch_keu');
    if(cvk&&typeof Chart!=='undefined'&&Object.keys(gBulan).length){
      if(CH._mon_keu) CH._mon_keu.destroy();
      var kKeys=Object.keys(gBulan).sort();
      CH._mon_keu=new Chart(cvk,{
        type:'bar',
        data:{labels:kKeys,datasets:[
          {label:'Pemasukan', data:kKeys.map(function(k){return gBulan[k].masuk;}), backgroundColor:'rgba(26,74,138,0.7)'},
          {label:'Pengeluaran',data:kKeys.map(function(k){return gBulan[k].keluar;}),backgroundColor:'rgba(192,57,43,0.7)'}
        ]},
        options:{responsive:true,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true},x:{grid:{display:false}}}}
      });
    }
  }
}



function reloadKeuPerkan() {
  var fromM = parseInt(document.getElementById('keu_from').value)||1;
  var toM   = parseInt(document.getElementById('keu_to').value)||12;
  var yr    = parseInt(document.getElementById('keu_yr').value)||new Date().getFullYear();
  if(!MON_DATA.keuangan) return;
  var data = (MON_DATA.keuangan||[]).filter(function(d){
    var dt=new Date(d.tanggal);
    return dt.getFullYear()===yr && (dt.getMonth()+1)>=fromM && (dt.getMonth()+1)<=toM;
  });
  // Group per week
  var P={};
  data.forEach(function(d){
    var dt=new Date(d.tanggal);
    var day=dt.getDay()||7;
    var thu=new Date(dt); thu.setDate(dt.getDate()+4-day);
    var jan1=new Date(thu.getFullYear(),0,1);
    var wn=Math.ceil((((thu-jan1)/86400000)+1)/7);
    var k='W'+String(wn).padStart(2,'0');
    if(!P[k]) P[k]={masuk:0,keluar:0};
    if(d.jenis==='pemasukan') P[k].masuk+=Number(d.jumlah)||0;
    else P[k].keluar+=Number(d.jumlah)||0;
  });
  var keys=Object.keys(P).sort();
  var cv=document.getElementById('ch_keu_pekan');
  if(!cv||typeof Chart==='undefined') return;
  if(CH._keu_pekan) CH._keu_pekan.destroy();
  if(!keys.length){
    var ctx=cv.getContext('2d');
    ctx.clearRect(0,0,cv.width,cv.height);
    return;
  }
  CH._keu_pekan=new Chart(cv,{
    type:'line',
    data:{labels:keys,datasets:[
      {label:'Pemasukan', data:keys.map(function(k){return P[k].masuk;}), borderColor:'#1a4a8a',backgroundColor:'rgba(26,74,138,0.08)',borderWidth:2,fill:true,tension:0.3,pointRadius:3},
      {label:'Pengeluaran',data:keys.map(function(k){return P[k].keluar;}),borderColor:'#c0392b',backgroundColor:'rgba(192,57,43,0.08)',borderWidth:2,fill:true,tension:0.3,pointRadius:3}
    ]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:10,padding:8}}},scales:{y:{beginAtZero:true},x:{grid:{display:false}}}}
  });
}

// ================================================================
//  HAPUS DATA (ADMIN)
// ================================================================
function hapusData(shName, id, reloadFn) {
  if (!confirm('Yakin hapus data ini? Tindakan tidak bisa dibatalkan.')) return;
  gasCall('hapusData', [shName, id],
    function(r) {
      toast('Data berhasil dihapus!', true);
      if (reloadFn) {
        var el = document.getElementById('pg' + Array.from(document.querySelectorAll('.pg')).findIndex(function(p){ return p.classList.contains('on'); }));
        if (el) reloadFn(el);
      }
    },
    function(m) { toast('Gagal hapus: ' + m, false); }
  );
}

// ================================================================
//  REFRESH PAGE
// ================================================================
function refreshPage() {
  var pgs = document.querySelectorAll('.pg');
  var activeIdx = 0;
  for (var i = 0; i < pgs.length; i++) {
    if (pgs[i].classList.contains('on')) { activeIdx = i; break; }
  }
  var el = document.getElementById('pg' + activeIdx);
  if (!el || !CU) return;
  var role = CU.role;
  var roleFnMap = {
    tabuk:   [pgTabukSub,pgTabukMon,pgRuanganJadwal],
    badar:   [pgBadarSub,pgBadarMon,pgRuanganJadwal],
    khandaq: [pgKhandaqSub,pgKhandaqMon,pgRuanganJadwal],
    ojol:    [pgOjolSub,pgOjolMon,pgRuanganJadwal],
    resq:    [pgResqSub,pgResqMon,pgRuanganJadwal],
    dakwah:  [pgDakwahSub,pgDakwahMon,pgRuanganJadwal],
    sarpras: [pgSarprasSub,pgSarprasMon,pgRuanganJadwal],
    ruangan: [pgRuanganSub,pgRuanganJadwal],
    monitor: [pgMonitorDash,pgRuanganJadwal],
    monitor: [pgMonitorDash,pgRuanganJadwal],
    bendum:  [pgBendumSub,pgBendumLap,pgRuanganJadwal],
    admin:   [pgAdminSum,pgAdminBudget,pgAdminTabuk,pgAdminBadar,pgAdminKhandaq,pgAdminOjol,pgAdminKeu,pgAdminRuangan]
  };
  var fns = roleFnMap[role] || [];
  if (fns[activeIdx]) {
    if(el) el.dataset.loaded = '1';
    fns[activeIdx](el);
  }
  toast('Halaman diperbarui', true);
}
