<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f4f4f0;color:#111;min-height:100vh}
#loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0a5c2e,#1a7a42)}
.lbox{background:#fff;border-radius:20px;padding:44px 40px;width:380px;max-width:94vw;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.llogo{text-align:center;margin-bottom:28px}
.lring{width:96px;height:96px;border-radius:50%;border:3px solid #c9981a;overflow:hidden;margin:0 auto 12px;background:#fff;display:flex;align-items:center;justify-content:center}
.lring img{width:92px;height:92px;object-fit:cover;border-radius:50%;display:block}
.lname{font-family:'Cinzel',serif;font-size:21px;font-weight:700;color:#0a5c2e;letter-spacing:3px}

.lbl{display:block;font-size:11px;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.8px;margin:14px 0 6px}
.finp{width:100%;padding:12px 14px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;color:#111;background:#fafaf6}
.finp:focus{outline:none;border-color:#0a5c2e}
.btnlogin{width:100%;margin-top:18px;padding:13px;background:#0a5c2e;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.btnlogin:hover{background:#1a7a42}.btnlogin:disabled{background:#999;cursor:not-allowed}
#msgbox{border-radius:8px;font-size:13px;padding:10px 13px;margin-top:10px;display:none;word-break:break-all}
.merr{background:#fff0ee;border:1px solid #f5c6c0;color:#c0392b}
.mok{background:#f0fff4;border:1px solid #b7ebc8;color:#0a5c2e}
.minf{background:#e8f4ff;border:1px solid #90cdf4;color:#1a4a8a}
.lfoot{text-align:center;margin-top:18px;font-size:11px;color:#bbb;line-height:1.8}

.hdr{background:#0a5c2e;height:56px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.25);gap:8px}
.hbrand{display:flex;align-items:center;gap:8px;flex-shrink:0;min-width:0}

.hlogo img{width:100%;height:100%;object-fit:cover;display:block}
.htitle{font-family:'Cinzel',serif;font-size:14px;font-weight:700;color:#fff;letter-spacing:1px;white-space:nowrap}

function gasCall(fn, args, onOk, onErr) {
  var payload = encodeURIComponent(JSON.stringify({ fn: fn, args: args || [] }));
  var url = GAS_API + '?payload=' + payload;
  fetch(url, { method: 'GET', redirect: 'follow' })
    .then(function(resp) { return resp.json(); })
    .then(function(r) {
      if (r && r.ok === false) { if (onErr) onErr(r.msg || 'Error'); }
      else { if (onOk) onOk(r); }
    })
    .catch(function(e) {
      if (onErr) onErr('Fetch error: ' + String(e));
    });
}

  });
}

// ================================================================
//  HELPER: makeEl - create element without innerHTML template
// ================================================================
function makeEl(tag, attrs, text) {
  var el = document.createElement(tag);
  if (attrs) {
    for (var k in attrs) {
      if (k === 'className') el.className = attrs[k];
      else if (k === 'textContent') el.textContent = attrs[k];
      else if (k === 'innerHTML') el.innerHTML = attrs[k];
      else if (k === 'onclick') el.onclick = attrs[k];
      else el.setAttribute(k, attrs[k]);
    }
  }
  if (text !== undefined) el.textContent = text;
  return el;
}

function mkInput(id, type, placeholder, val) {
  var inp = document.createElement('input');
  inp.type = type || 'text';
  inp.id = id;
  if (placeholder) inp.placeholder = placeholder;
  if (val !== undefined) inp.value = val;
  return inp;
}

function mkLabel(txt, req) {
  var l = document.createElement('label');
  l.className = 'fl';
  l.innerHTML = txt + (req ? ' <span class="req">*</span>' : '');
  return l;
}

function mkFg2() { var d = document.createElement('div'); d.className = 'fg2'; return d; }
function mkFgItem() { var d = document.createElement('div'); return d; }
function mkCard(head, bodyFn) {
  var card = document.createElement('div'); card.className = 'card';
  var ch = document.createElement('div'); ch.className = 'chead'; ch.textContent = head;
  var cb = document.createElement('div'); cb.className = 'cbody';
  card.appendChild(ch); card.appendChild(cb);
  if (bodyFn) bodyFn(cb);
  return card;
}

function mkPh(title, sub) {
  var div = document.createElement('div'); div.className = 'ph';
  var h2 = document.createElement('h2'); h2.textContent = title;
  var p = document.createElement('p'); p.textContent = sub;
  div.appendChild(h2); div.appendChild(p);
  return div;
}

function mkSelect(id, options) {
  var sel = document.createElement('select'); sel.id = id;
  for (var i = 0; i < options.length; i++) {
    var opt = document.createElement('option');
    opt.value = options[i].v || '';
    opt.textContent = options[i].t;
    sel.appendChild(opt);
  }
  return sel;
}

function mkRpInput(id) {
  var wrap = document.createElement('div'); wrap.className = 'rpw';
  var pfx = document.createElement('span'); pfx.className = 'rppfx'; pfx.textContent = 'Rp';
  var inp = document.createElement('input'); inp.type = 'number'; inp.id = id; inp.min = '0'; inp.step = '1000'; inp.placeholder = '0';
  wrap.appendChild(pfx); wrap.appendChild(inp);
  return wrap;
}

function mkBtn(cls, txt, fn) {
  var b = document.createElement('button'); b.className = cls; b.textContent = txt; b.onclick = fn; return b;
}

function mkAct() { var d = document.createElement('div'); d.className = 'act'; return d; }

function addFgRow(fg, items) {
  for (var i = 0; i < items.length; i++) {
    var wrap = document.createElement('div');
    if (items[i].label !== undefined) {
      wrap.appendChild(mkLabel(items[i].label, items[i].req));
    }
    if (items[i].el) wrap.appendChild(items[i].el);
    fg.appendChild(wrap);
  }
}

function buildKegMon(el, role, label, getFn) {
  var curY=new Date().getFullYear();
  var MN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  var mOpts=[{v:'',t:'Semua'}]; for(var i=0;i<12;i++) mOpts.push({v:''+(i+1),t:MN[i]});
  var yOpts=[{v:'',t:'Semua'}]; for(var y=curY;y>=curY-2;y--) yOpts.push({v:''+y,t:''+y});

  el.innerHTML = '';
  el.appendChild(mkPh('Rekap Kegiatan - '+label, 'Riwayat dan statistik kegiatan'));

  el.appendChild(statDiv);

  var chw = document.createElement('div'); chw.className = 'chw';

  card.innerHTML = '<div class="chead">Tabel Riwayat<div class="fbr"><div><label class="fl" style="margin-bottom:3px">Bulan</label></div><div><label class="fl" style="margin-bottom:3px">Tahun</label></div></div></div>'+
    '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>#</th><th>Tanggal</th><th>Waktu</th><th>Nama Kegiatan</th><th>Tempat</th><th>Peserta</th><th>Anggaran</th><th>Catatan</th></tr></thead>'+
    '<tbody id="'+role+'_tb"><tr><td colspan="8">'+SK(2)+'</td></tr></tbody></table></div>';

  // Insert selects into the filter bar
  var fbItems = card.querySelectorAll('.fbr > div');
  if(fbItems[0]) fbItems[0].appendChild(selFm);
  if(fbItems[1]) fbItems[1].appendChild(selFy);

}

function loadKeg2(role, getFn) {
  var mE=document.getElementById(role+'_fm'), yE=document.getElementById(role+'_fy'), f={};
  if(mE&&mE.value) f.bulan=Number(mE.value);
  if(yE&&yE.value) f.tahun=Number(yE.value);
  gasCall(getFn,[f],function(res){
    var data=res.data||[], totP=0, totA=0;
    for(var i=0;i<data.length;i++){ totP+=Number(data[i].peserta)||0; totA+=Number(data[i].anggaran)||0; }
    var st=document.getElementById(role+'_stat');
    if(st) st.innerHTML='<div class="sg">'+
      '<div class="sc"><div class="sl">Total Kegiatan</div><div class="sv">'+data.length+'</div><div class="sss">kegiatan</div></div>'+
      '<div class="sc"><div class="sl">Total Peserta</div><div class="sv">'+totP.toLocaleString('id-ID')+'</div><div class="sss">orang</div></div>'+
      '<div class="sc"><div class="sl">Total Anggaran</div><div class="sv" style="font-size:16px">'+rp(totA)+'</div><div class="sss">terpakai</div></div></div>';
    var P={};
    for(var i=0;i<data.length;i++){
      var dt=new Date(data[i].tanggal);
      var mn=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'][dt.getMonth()];
      var k=dt.getFullYear()+'-'+(dt.getMonth()+1);
      if(!P[k]) P[k]={count:0,lbl:mn+' '+dt.getFullYear()};
      P[k].count++;
    }
    var keys=Object.keys(P).sort(), lb=[], vals=[];
    for(var j=0;j<keys.length;j++){ lb.push(P[keys[j]].lbl); vals.push(P[keys[j]].count); }
    var cv=document.getElementById('ch_'+role);
    if(cv&&typeof Chart!=='undefined'){
      if(CH['kk_'+role]) CH['kk_'+role].destroy();
      CH['kk_'+role]=new Chart(cv,{type:'line',data:{labels:lb,datasets:[{label:'Kegiatan',data:vals,borderColor:'#0a5c2e',backgroundColor:'rgba(10,92,46,0.08)',borderWidth:2,fill:true,tension:0.3,pointRadius:4,pointBackgroundColor:'#0a5c2e'}]},options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{stepSize:1}},x:{grid:{display:false}}}}});
    }
    var b=document.getElementById(role+'_tb'); if(!b) return;
    if(!data.length){ b.innerHTML='<tr><td colspan="9" style="text-align:center;padding:30px;color:#aaa">Belum ada data.</td></tr>'; return; }
    var rows='';
    for(var i=0;i<data.length;i++){
      var d=data[i];
      rows+='<tr><td>'+(i+1)+'</td><td data-val="'+d.tanggal+'"><span class="badge bg">'+fS(d.tanggal)+'</span></td>'+
        '<td style="white-space:nowrap">'+(d.waktu_start||'-')+' - '+(d.waktu_stop||'-')+' WIB</td>'+
        '<td>'+d.nama_kegiatan+'</td><td>'+d.tempat+'</td>'+
        '<td>'+d.peserta+'</td><td>'+rp(d.anggaran)+'</td>'+
        '<td style="font-size:12px;color:#aaa">'+(d.catatan||'-')+'</td></tr>';
    }
    b.innerHTML=rows;
  },function(m){ toast('Gagal: '+m,false); });
}

function renderJadwal(el, isAdmin) {
  var curY=new Date().getFullYear();
  var MN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  var mOpts=[{v:'',t:'Semua'}]; for(var i=0;i<12;i++) mOpts.push({v:''+(i+1),t:MN[i]});
  var yOpts=[{v:'',t:'Semua'}]; for(var y=curY;y>=curY-1;y--) yOpts.push({v:''+y,t:''+y});

  if(el) {
    el.innerHTML='';
    el.appendChild(mkPh('Status Pemesanan Ruang Masjid','Semua pemesanan ruangan masjid'));

    var card = document.createElement('div'); card.className='card';
    var selFm = mkSelect('rng_fm', mOpts);
    var selFy = mkSelect('rng_fy', yOpts);
    selFm.onchange = function(){ doLoadJadwal(isAdmin); };
    selFy.onchange = function(){ doLoadJadwal(isAdmin); };

    var cols = isAdmin ? 8 : 7;
    var extraTh = isAdmin ? '<th>Aksi</th>' : '';
    card.innerHTML='<div class="chead">Tabel Jadwal<div class="fbr">'+
      '<div><label class="fl" style="margin-bottom:3px">Bulan</label></div>'+
      '<div><label class="fl" style="margin-bottom:3px">Tahun</label></div>'+
      '</div></div>'+
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr>'+
      '<th>#</th>'+
      '<th class="sth" data-col="1" onclick="sortTable(\"rng_tb\",1,\"date\")">Tanggal</th>'+
      '<th>Waktu</th><th>Lantai</th>'+
      '<th class="sth" data-col="4" onclick="sortTable(\"rng_tb\",4,\"str\")">Kegiatan / Pengirim</th>'+
      '<th>PJ / HP</th><th>Status</th>'+extraTh+
      '</tr></thead><tbody id="rng_tb"><tr><td colspan="'+cols+'">'+SK(2)+'</td></tr></tbody></table></div>';

    var fbItems = card.querySelectorAll('.fbr > div');
    if(fbItems[0]) fbItems[0].appendChild(selFm);
    if(fbItems[1]) fbItems[1].appendChild(selFy);
    el.appendChild(card);
  }
  doLoadJadwal(isAdmin);
}

function doLoadJadwal(isAdmin) {
  var mE=document.getElementById('rng_fm'), yE=document.getElementById('rng_fy'), f={};
  if(mE&&mE.value) f.bulan=Number(mE.value);
  if(yE&&yE.value) f.tahun=Number(yE.value);
  var cols=isAdmin?8:7;
  gasCall('getRuangan',[f],function(res){
    var data=res.data||[], b=document.getElementById('rng_tb'); if(!b) return;
    if(!data.length){ b.innerHTML='<tr><td colspan="'+cols+'" style="text-align:center;padding:30px;color:#aaa">Belum ada pemesanan.</td></tr>'; return; }
    var rows='';
    for(var i=0;i<data.length;i++){
      var d=data[i];
      d._dateVal=d.tanggal;
      var stTag=d.status==='CONFIRMED'?
        '<span class="tag-confirmed">CONFIRMED</span>':
        '<span class="tag-unconfirmed">UNCONFIRMED</span>';
      var aksi='';
      if(isAdmin){
        aksi='<td>'+
          '<button class="btn-confirm" onclick="ubahStsRng(\''+d.id+'\',\'CONFIRMED\')">OK</button>'+
          '<button class="btn-unconfirm" onclick="ubahStsRng(\''+d.id+'\',\'UNCONFIRMED\')">Batal</button>'+
          '<button class="btnhps" onclick="hapusRng(\''+d.id+'\')">Hapus</button>'+
          '</td>';
      }
      rows+='<tr>'+
        '<td>'+(i+1)+'</td>'+
        '<td data-val="'+d.tanggal+'"><span class="badge bg">'+fS(d.tanggal)+'</span></td>'+
        '<td style="white-space:nowrap">'+d.waktu_start+' - '+d.waktu_stop+' WIB</td>'+
        '<td><span class="badge bg">'+d.lantai+'</span></td>'+
        '<td>'+d.nama_kegiatan+'<br><small style="color:#aaa;font-size:11px">'+d.submitted_by+'</small></td>'+
        '<td style="font-size:12px">'+d.pj_acara+'<br>'+d.no_hp+'</td>'+
        '<td>'+stTag+'</td>'+aksi+
        '</tr>';
    }
    b.innerHTML=rows;
    defaultSortDate('rng_tb',1);
  },function(m){ toast('Gagal: '+m,false); });
}

function ubahStsRng(id,status){
  gasCall('updateStatusRuangan',[id,status],
    function(){ toast('Status: '+status,true); doLoadJadwal(true); },
    function(m){ toast('Gagal: '+m,false); }
  );
}

function hapusRng(id){
  if(!confirm('Yakin hapus pemesanan ini?')) return;
  gasCall('hapusData',['ruangan_data',id],
    function(){ toast('Pemesanan dihapus',true); doLoadJadwal(true); },
    function(m){ toast('Gagal: '+m,false); }
  );
}

      };
    })(s.id, tab);
    secTabs.appendChild(tab);
  });
  el.appendChild(secTabs);

  sections.forEach(function(s, idx) {
    var div=document.createElement('div'); div.id=s.id; div.className='mon-sec';
    div.style.display = idx===0?'block':'none'; div.innerHTML=SK(2);
    el.appendChild(div);
  });

  loadMonitorAll();
}

function renderChartTim(res) {
  var MN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
  var mode = MON_CHART_TIM_MODE;

  function groupData(arr, field) {
    var P = {};
    (arr||[]).forEach(function(d){
      var dt = new Date(d.tanggal);
      var k = mode==='bulan' ? (dt.getFullYear()+'-'+(dt.getMonth()+1)) : (''+dt.getFullYear());
      P[k] = (P[k]||0)+1;
    });
    return P;
  }

  var datasets = [
    {label:'Jumat Berkah', data:groupData(res.tabuk),   color:'#0a5c2e'},
    {label:'Ojol',         data:groupData(res.ojol),    color:'#4A235A'},
    {label:'Resq',         data:groupData(res.resq),    color:'#8B0000'},
    {label:'Dakwah',       data:groupData(res.dakwah),  color:'#1A5A8A'},
    {label:'Sarpras',      data:groupData(res.sarpras), color:'#5A3A1A'},
  ];

  var allKeys = {};
  datasets.forEach(function(ds){ Object.keys(ds.data).forEach(function(k){ allKeys[k]=1; }); });
  var sortedKeys = Object.keys(allKeys).sort();
  var lbls = sortedKeys.map(function(k){
    if(mode==='bulan'){ var p=k.split('-'); return MN[parseInt(p[1])-1]+' '+p[0]; }
    return k;
  });

  var cv = document.getElementById('ch_mon_tim');
  if(cv&&typeof Chart!=='undefined'){
    if(CH._mon_tim) CH._mon_tim.destroy();
    CH._mon_tim = new Chart(cv,{
      type:'bar',
      data:{
        labels:lbls,
        datasets:datasets.map(function(ds){
          return {
            label:ds.label,
            data:sortedKeys.map(function(k){return ds.data[k]||0;}),
            backgroundColor:ds.color+'bb',
            borderColor:ds.color,
            borderWidth:1
          };
        })
      },
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:10,padding:6}}},scales:{x:{beginAtZero:true,ticks:{stepSize:1}},y:{grid:{display:false}}}}
    });
  }
}

      '<div class="sc"><div class="sl">Total Pemasukan</div><div class="sv" style="font-size:14px;color:#1a4a8a">'+rp(ks.totalMasuk)+'</div><div class="sss">keseluruhan</div></div>'+

      // Tables
      '<div class="card" style="margin-top:12px"><div class="chead">Ringkasan per Pekan</div>'+
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>#</th><th>Pekan</th><th>Pemasukan</th><th>Pengeluaran</th><th>Selisih</th></tr></thead>'+

      '<div class="card" style="margin-top:12px"><div class="chead">Ringkasan per Bulan</div>'+
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>#</th><th>Bulan</th><th>Pemasukan</th><th>Pengeluaran</th><th>Selisih</th></tr></thead>'+

      '<div class="card" style="margin-top:12px"><div class="chead">Ringkasan per Tahun</div>'+
      '<div style="overflow-x:auto"><table class="tbl"><thead><tr><th>#</th><th>Tahun</th><th>Pemasukan</th><th>Pengeluaran</th><th>Selisih</th></tr></thead>'+
      '<tbody>'+renderKeuTable('tahun',gTahun)+'</tbody></table></div></div>';

    // Render keuangan chart
    var cvk=document.getElementById('ch_keu');
    if(cvk&&typeof Chart!=='undefined'&&Object.keys(gBulan).length){
      if(CH._mon_keu) CH._mon_keu.destroy();

function reloadKeuPerkan() {

  var toM   = parseInt(document.getElementById('keu_to').value)||12;
  var yr    = parseInt(document.getElementById('keu_yr').value)||new Date().getFullYear();
  if(!MON_DATA.keuangan) return;
  var data = (MON_DATA.keuangan||[]).filter(function(d){
    var dt=new Date(d.tanggal);
    return dt.getFullYear()===yr && (dt.getMonth()+1)>=fromM && (dt.getMonth()+1)<=toM;
  });
  // Group per week
  var P={};
  data.forEach(function(d){
    var dt=new Date(d.tanggal);
    var day=dt.getDay()||7;
    var thu=new Date(dt); thu.setDate(dt.getDate()+4-day);
    var jan1=new Date(thu.getFullYear(),0,1);
    var wn=Math.ceil((((thu-jan1)/86400000)+1)/7);
    var k='W'+String(wn).padStart(2,'0');
    if(!P[k]) P[k]={masuk:0,keluar:0};
    if(d.jenis==='pemasukan') P[k].masuk+=Number(d.jumlah)||0;
    else P[k].keluar+=Number(d.jumlah)||0;
  });
  var keys=Object.keys(P).sort();
  var cv=document.getElementById('ch_keu_pekan');
  if(!cv||typeof Chart==='undefined') return;
  if(CH._keu_pekan) CH._keu_pekan.destroy();
  if(!keys.length){
    var ctx=cv.getContext('2d');
    ctx.clearRect(0,0,cv.width,cv.height);
    return;
  }
  CH._keu_pekan=new Chart(cv,{
    type:'line',
    data:{labels:keys,datasets:[
      {label:'Pemasukan', data:keys.map(function(k){return P[k].masuk;}), borderColor:'#1a4a8a',backgroundColor:'rgba(26,74,138,0.08)',borderWidth:2,fill:true,tension:0.3,pointRadius:3},
      {label:'Pengeluaran',data:keys.map(function(k){return P[k].keluar;}),borderColor:'#c0392b',backgroundColor:'rgba(192,57,43,0.08)',borderWidth:2,fill:true,tension:0.3,pointRadius:3}
    ]},
    options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:10},boxWidth:10,padding:8}}},scales:{y:{beginAtZero:true},x:{grid:{display:false}}}}
  });
}

function parseBsiCsv(input) {
  var file = input.files[0]; if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    var text = e.target.result;
    var lines = text.split('\n').filter(function(l){ return l.trim(); });

    // Find header row
    var headerIdx = -1;
    for(var i=0;i<lines.length;i++){
      if(lines[i].indexOf('Waktu Transaksi')>=0){ headerIdx=i; break; }
    }
    if(headerIdx<0){ toast('Format CSV tidak dikenali. Pastikan file dari BSI Internet Banking.',false); return; }

    // Extract rekening number from header
    var rekeningNo = '', rekeningName = '';
    var infoLines = lines.slice(0, headerIdx);
    var periode = '';
    infoLines.forEach(function(l){
      if(l.indexOf('Rekening')>=0 && l.indexOf('IDR')>=0){
        // Extract nomor rekening
        var match = l.match(/IDR\s+(\d+)/);
        if(match) {
          rekeningNo = match[1];
          rekeningName = REKENING_MAP[rekeningNo] || ('BSI '+rekeningNo);
        }
      }
      if(l.indexOf('Periode')>=0) periode = l.split(':').slice(1).join(':').replace(/"/g,'').trim();
    });

    // Parse transactions
    var dataLines = lines.slice(headerIdx+1);
    var transactions = [];
    dataLines.forEach(function(line){
      if(!line.trim()) return;
      var cols = parseCsvLine(line);
      if(cols.length < 9) return;
      var waktu     = cols[0].replace(/"/g,'').trim();
      var deskripsi = cols[6].replace(/"/g,'').trim();
      var debet     = cols[7].replace(/"/g,'').replace(/-/g,'').replace(/,/g,'').trim();
      var kredit    = cols[8].replace(/"/g,'').replace(/,/g,'').trim();
      if(!waktu) return;
      var datePart = waktu.split(' ')[0];
      var dparts = datePart.split('-');
      var tgl = dparts.length===3 ? dparts[2]+'-'+dparts[1]+'-'+dparts[0] : datePart;
      var jenis = kredit && Number(kredit)>0 ? 'pemasukan' : 'pengeluaran';
      var jumlah = jenis==='pemasukan' ? Number(kredit||0) : Number(debet||0);
      jumlah = Math.round(jumlah);
      if(!jumlah) return;
      transactions.push({ tanggal:tgl, jenis:jenis, keterangan:deskripsi, jumlah:jumlah, selected:true });
    });

    if(!transactions.length){ toast('Tidak ada transaksi yang bisa dibaca.',false); return; }

    // Store globally
    window._impTrx = transactions;
    window._impRekNo = rekeningNo;
    window._impRekName = rekeningName;
    window._impPeriode = periode;

    renderImportPreview(transactions, periode, rekeningNo, rekeningName);
  };
  reader.readAsText(file,'UTF-8');
}

function parseCsvLine(line) {
  var result=[], cur='', inQ=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch==='"'){ inQ=!inQ; }
    else if(ch===','&&!inQ){ result.push(cur); cur=''; }
    else { cur+=ch; }
  }
  result.push(cur);
  return result;
}

//  Parse Account Statement BSI langsung di browser
// ================================================================

// PDF.js will be loaded dynamically
var PDFJS_LOADED = false;

function loadPdfJs(callback) {
  if (PDFJS_LOADED) { callback(); return; }
  var script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  script.onload = function() {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    PDFJS_LOADED = true;
    callback();
  };
  document.head.appendChild(script);
}

function parseBsiPdf(file) {
  var statusEl = document.getElementById('imp_pdf_status');
  if (statusEl) { statusEl.textContent = 'Memuat PDF.js...'; statusEl.style.color = '#888'; }

  loadPdfJs(function() {
    if (statusEl) statusEl.textContent = 'Membaca PDF...';

    var reader = new FileReader();
    reader.onload = function(e) {
      var arrayBuffer = e.target.result;
      pdfjsLib.getDocument({ data: arrayBuffer }).promise.then(function(pdf) {
        var totalPages = pdf.numPages;
        var allText = '';
        var pagePromises = [];

        for (var i = 1; i <= totalPages; i++) {
          pagePromises.push(
            pdf.getPage(i).then(function(page) {
              return page.getTextContent().then(function(tc) {
                // Sort items by Y position (top to bottom), then X (left to right)
                var items = tc.items.slice().sort(function(a,b){
                  var dy = Math.round(b.transform[5]) - Math.round(a.transform[5]);
                  return dy !== 0 ? dy : a.transform[4] - b.transform[4];
                });
                // Group into lines by Y position
                var lines = [], curY = null, curLine = [];
                items.forEach(function(item) {
                  var y = Math.round(item.transform[5]);
                  if (curY === null) curY = y;
                  if (Math.abs(y - curY) > 5) {
                    if (curLine.length) lines.push(curLine.join(' '));
                    curLine = []; curY = y;
                  }
                  curLine.push(item.str);
                });
                if (curLine.length) lines.push(curLine.join(' '));
                return lines.join('\n');
              });
            })
          );
        }

        Promise.all(pagePromises).then(function(pageTexts) {
          allText = pageTexts.join('\n');
          var result = parseBsiPdfText(allText);
          if (result.error) {
            toast('PDF tidak dikenali: ' + result.error, false);
            if (statusEl) { statusEl.textContent = 'Gagal: ' + result.error; statusEl.style.color = '#c0392b'; }
            return;
          }
          window._impTrx       = result.transactions;
          window._impRekNo     = result.rekeningNo;
          window._impRekName   = result.rekeningName;
          window._impPeriode   = result.periode;
          if (statusEl) { statusEl.textContent = result.transactions.length + ' transaksi berhasil dibaca dari PDF.'; statusEl.style.color = '#0a5c2e'; }
          renderImportPreview(result.transactions, result.periode, result.rekeningNo, result.rekeningName);
        });
      }).catch(function(err) {
        toast('Gagal membaca PDF: ' + err.message, false);
        if (statusEl) { statusEl.textContent = 'Error: ' + err.message; statusEl.style.color = '#c0392b'; }
      });
    };
    reader.readAsArrayBuffer(file);
  });
}

function parseBsiPdfText(text) {
  var lines = text.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);

  // Extract rekening number
  var rekeningNo = '', periode = '';
  for (var i = 0; i < lines.length; i++) {
    var m = lines[i].match(/Rekening\s*:?\s*(\d{10,})/);
    if (m) { rekeningNo = m[1]; }
    var p = lines[i].match(/Date\s*:?\s*(.+\d{4})/);
    if (p) { periode = p[1].trim(); }
  }

  if (!rekeningNo) return { error: 'Nomor rekening tidak ditemukan. Pastikan file adalah Account Statement BSI.' };

  var rekeningName = REKENING_MAP[rekeningNo] || ('BSI ' + rekeningNo);

  // Parse transaction lines
  // Pattern: date YYYY-MM-DD, then description, IDR, amount, DB|CR, saldo
  var trxPattern = /(\d{4}-\d{2}-\d{2})\s+\d{2}:\d{2}:\d{2}\s*\S*\s+(.+?)\s+IDR\s+([\d,]+(?:\.\d+)?)\s*(DB|CR)\s+([\d,]+(?:\.\d+)?)/;
  // Alternative for 1001009121 format (space between FT and description)
  var trxPattern2 = /(\d{4}-\d{2}-\d{2})\s+\d{2}:\d{2}:\d{2}\s+\S+\s+(.+?)\s+IDR\s+([\d,]+(?:\.\d+)?)\s*(DB|CR)\s+([\d,]+(?:\.\d+)?)/;

  var transactions = [];

  lines.forEach(function(line) {
    var m = line.match(trxPattern) || line.match(trxPattern2);
    if (!m) return;

    var tgl     = m[1];
    var desk    = m[2].trim();
    var jumlah  = Math.round(Number(m[3].replace(/,/g,'')));
    var dbcr    = m[4];
    var jenis   = dbcr === 'CR' ? 'pemasukan' : 'pengeluaran';

    if (!jumlah || jumlah <= 0) return;

    // Clean up description - remove FT numbers at start
    desk = desk.replace(/^FT\w+\s+/, '').replace(/^\w{15,}\s+/, '').trim();

    transactions.push({
      tanggal: tgl,
      keterangan: desk,
      jenis: jenis,
      jumlah: jumlah,
      selected: true
    });
  });

  return { rekeningNo: rekeningNo, rekeningName: rekeningName, periode: periode, transactions: transactions };
}

// Helper: angka ke terbilang Bahasa Indonesia
function terbilang(angka) {
  var satuan = ['','satu','dua','tiga','empat','lima','enam','tujuh','delapan','sembilan',
    'sepuluh','sebelas','dua belas','tiga belas','empat belas','lima belas','enam belas',
    'tujuh belas','delapan belas','sembilan belas'];
  var ribuan = ['','ribu','juta','miliar','triliun'];

  if (angka === 0) return 'nol';
  if (angka < 0) return 'minus ' + terbilang(-angka);

  var hasil = '';
  var n = Math.floor(angka);
  var level = 0;

  function kelompok(n) {
    if (n === 0) return '';
    if (n < 20) return satuan[n] + ' ';
    if (n < 100) return satuan[Math.floor(n/10)*10 > 0 ? 0 : 0] + (Math.floor(n/10) === 1 ? '' : satuan[Math.floor(n/10)]) + (Math.floor(n/10) === 1 ? 'sepuluh ' : ' puluh ') + kelompok(n % 10);
    if (n < 100) return satuan[Math.floor(n/10)] + ' puluh ' + kelompok(n%10);
    if (n < 1000) return (n >= 100 ? (Math.floor(n/100) === 1 ? 'seratus ' : satuan[Math.floor(n/100)] + ' ratus ') : '') + kelompok(n%100);
    return kelompok(n);
  }

  function conv(n) {
    if (n === 0) return '';
    if (n < 20) return satuan[n] + ' ';
    if (n < 100) {
      var p = Math.floor(n/10), s = n%10;
      return (p===1 ? 'sepuluh ' : satuan[p]+' puluh ') + (s>0 ? satuan[s]+' ' : '');
    }
    var h = Math.floor(n/100), rem = n%100;
    return (h===1?'seratus ':satuan[h]+' ratus ') + conv(rem);
  }

  var bagian = [];
  var tmp = n;
  var lv = 0;
  while (tmp > 0) {
    var grp = tmp % 1000;
    if (grp > 0) {
      var str = (grp===1 && lv===1) ? 'seribu ' : conv(grp) + (lv>0 ? ribuan[lv]+' ' : '');
      bagian.unshift(str);
    }
    tmp = Math.floor(tmp/1000);
    lv++;
  }
  return bagian.join('').trim() + ' rupiah';
}

  for (var i=0; i<REKENING.length; i++) rekOpts += '<option value="'+REKENING[i]+'">'+REKENING[i]+'</option>';
  rekSel.innerHTML = rekOpts;
  rekSel.style.cssText = 'width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:13px';
  rekWrap.appendChild(rekSel);
  cb.appendChild(rekWrap);

  // TANGGAL
  var tglWrap = document.createElement('div'); tglWrap.style.marginBottom='14px';
  tglWrap.appendChild(mkLabel('Tanggal Transaksi',true));
  var tglInp = mkInput('kuit_tanggal','date','');
  tglInp.value = new Date().toISOString().split('T')[0];
  tglWrap.appendChild(tglInp);
  cb.appendChild(tglWrap);

  // NAMA DONATUR
  var namaWrap = document.createElement('div'); namaWrap.style.marginBottom='14px';
  namaWrap.appendChild(mkLabel('Nama Pengirim / Donatur',true));
  var namaInp = mkInput('kuit_nama','text','Nama lengkap pengirim...');
  namaWrap.appendChild(namaInp);
  cb.appendChild(namaWrap);

  // NOMINAL
  var nomWrap = document.createElement('div'); nomWrap.style.marginBottom='14px';
  nomWrap.appendChild(mkLabel('Nominal Diterima (Rp)',true));
  var nomInp = document.createElement('input');
  nomInp.type = 'text';
  nomInp.id   = 'kuit_nominal';
  nomInp.placeholder = '0';
  nomInp.inputMode = 'numeric';
  nomInp.style.cssText = 'width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:14px;font-weight:600;letter-spacing:.5px';
  nomInp.oninput = function() {
    var raw = this.value.replace(/\./g,'').replace(/[^0-9]/g,'');
    var num = parseInt(raw)||0;
    // Format dengan titik ribuan
    this.value = num > 0 ? num.toLocaleString('id-ID') : '';
    // Store raw numeric value as data attribute
    this.setAttribute('data-num', num);
    var tbEl = document.getElementById('kuit_terbilang_preview');
    if(tbEl) tbEl.textContent = num > 0 ? terbilang(num) : '';
  };
  nomInp.onkeydown = function(e) {
    // Allow: backspace, delete, tab, escape, arrows, home, end
    var allowed = [8,9,27,35,36,37,38,39,40,46];
    if(allowed.indexOf(e.keyCode) >= 0) return;
    // Allow: Ctrl+A, Ctrl+C, Ctrl+V, Ctrl+X
    if(e.ctrlKey && [65,67,86,88].indexOf(e.keyCode) >= 0) return;
    // Only allow digits
    if((e.shiftKey || e.keyCode < 48 || e.keyCode > 57) && (e.keyCode < 96 || e.keyCode > 105)) {
      e.preventDefault();
    }
  };
  nomWrap.appendChild(nomInp);
  var tbPrev = document.createElement('div');
  tbPrev.id = 'kuit_terbilang_preview';
  tbPrev.style.cssText = 'font-size:12px;color:#0a5c2e;margin-top:4px;font-style:italic';
  nomWrap.appendChild(tbPrev);
  cb.appendChild(nomWrap);

  // KETERANGAN
  var ketWrap = document.createElement('div'); ketWrap.style.marginBottom='14px';
  ketWrap.appendChild(mkLabel('Keterangan / Untuk Pembayaran',true));
  var ketInp = document.createElement('textarea');
  ketInp.id = 'kuit_keterangan';
  ketInp.placeholder = 'Contoh: infaq DKM masjid Al Qolam';
  ketInp.rows = 3;
  ketInp.style.cssText = 'width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font-size:13px;resize:vertical';
  ketWrap.appendChild(ketInp);
  cb.appendChild(ketWrap);

  // DICATAT OLEH
  var olehWrap = document.createElement('div'); olehWrap.style.marginBottom='20px';
  olehWrap.appendChild(mkLabel('Dicatat Oleh',true));
  var olehInp = mkInput('kuit_oleh','text','');
  if(CU) olehInp.value = CU.name;
  olehWrap.appendChild(olehInp);
  cb.appendChild(olehWrap);

  // BUTTON
  var act = document.createElement('div'); act.className='act';
  var btnPreview = document.createElement('button');
  btnPreview.className='btnp'; btnPreview.textContent='Pratinjau & Konfirmasi';
  btnPreview.onclick = pratinjauKuitansi;
  act.appendChild(btnPreview);
  cb.appendChild(act);

  card.appendChild(ch); card.appendChild(cb);
  el.appendChild(card);

  // Preview area
  var prev = document.createElement('div'); prev.id='kuit_preview_area';
  el.appendChild(prev);
}

function pratinjauKuitansi() {
  var v = function(id){ var e=document.getElementById(id); return e?e.value.trim():''; };
  var rek    = v('kuit_rekening');
  var tgl    = v('kuit_tanggal');
  var nama   = v('kuit_nama');
  var nomEl  = document.getElementById('kuit_nominal');
  var nom    = parseInt(nomEl ? nomEl.getAttribute('data-num') : '0')||0;
  var ket    = v('kuit_keterangan');
  var oleh   = v('kuit_oleh');

  if(!rek)  { toast('Pilih rekening!', false); return; }
  if(!tgl)  { toast('Isi tanggal!', false); return; }
  if(!nama) { toast('Isi nama donatur!', false); return; }
  if(!nom)  { toast('Isi nominal!', false); return; }
  if(!ket)  { toast('Isi keterangan!', false); return; }

  var tb = terbilang(nom);

  // Get counter first
  gasCall('getKuitansiCounter',[], function(res) {
    var counter = res.counter || 31;
    var tglObj  = new Date(tgl);
    var bulan   = String(tglObj.getMonth()+1).padStart(2,'0');
    var nomorPreview = counter + '/AlQolam/' + bulan + '/2026';

    var prev = document.getElementById('kuit_preview_area'); if(!prev) return;

    var tglFormatted = tglObj.toLocaleDateString('id-ID',{day:'2-digit',month:'long',year:'numeric'});

    prev.innerHTML =
      '<div class="card" style="margin-top:16px">'+
      '<div class="chead" style="background:#1a4a8a;color:#fff">'+
      '📄 Pratinjau Kuitansi — No. '+nomorPreview+'</div>'+
      '<div class="cbody">'+
      '<div style="background:#fff8e8;border:.5px solid #c9981a;border-radius:8px;padding:14px;margin-bottom:16px;font-size:12px">'+
      '<b>⚠️ Periksa data sebelum konfirmasi.</b> Setelah dikonfirmasi, nomor kuitansi akan digunakan dan tidak bisa diulang.'+
      '</div>'+
      '<table style="width:100%;font-size:13px;border-collapse:collapse">'+
      '<tr><td style="padding:7px 0;color:#888;width:160px">Nomor Kuitansi</td><td><b>'+nomorPreview+'</b></td></tr>'+
      '<tr><td style="padding:7px 0;color:#888">Tanggal</td><td>'+tglFormatted+'</td></tr>'+
      '<tr><td style="padding:7px 0;color:#888">Telah Diterima Dari</td><td><b>'+nama+'</b></td></tr>'+
      '<tr><td style="padding:7px 0;color:#888">Nominal</td><td><b style="color:#1a4a8a;font-size:15px">'+fmtRp(nom)+'</b></td></tr>'+
      '<tr><td style="padding:7px 0;color:#888">Terbilang</td><td style="font-style:italic">'+tb+'</td></tr>'+
      '<tr><td style="padding:7px 0;color:#888">Untuk Pembayaran</td><td>'+ket+'</td></tr>'+
      '<tr><td style="padding:7px 0;color:#888">Rekening</td><td>'+rek+'</td></tr>'+
      '<tr><td style="padding:7px 0;color:#888">Dicatat Oleh</td><td>'+oleh+'</td></tr>'+
      '</table>'+
      '<div class="act" style="margin-top:16px;gap:10px">'+
      '<button class="btno" onclick="document.getElementById(\'kuit_preview_area\').innerHTML=\'\'">← Edit</button>'+
      '<button class="btnp" id="kuit_confirm_btn" style="background:#0a5c2e" onclick="konfirmasiKuitansi(\''+
        encodeURIComponent(JSON.stringify({rek,tgl,nama,nom,ket,oleh,nomorPreview,tb,tglFormatted}))+'\')">'+
      '✓ Konfirmasi & Generate Kuitansi</button>'+
      '</div></div></div>';
  }, function(m){ toast('Gagal ambil nomor: '+m, false); });
}

function konfirmasiKuitansi(encoded) {
  var d = JSON.parse(decodeURIComponent(encoded));
  var btn = document.getElementById('kuit_confirm_btn');
  if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }

  gasCall('saveKuitansi',[{
    tanggal: d.tgl,
    nama_donatur: d.nama,
    nominal: d.nom,
    nominal_terbilang: d.tb,
    keterangan: d.ket,
    rekening: d.rek,
    dicatat_oleh: d.oleh
  }], function(res) {
    if(!res.ok){ toast('Gagal simpan: '+(res.msg||''), false); if(btn){btn.disabled=false;btn.textContent='✓ Konfirmasi & Generate Kuitansi';} return; }
    toast('Kuitansi No. '+res.nomor+' berhasil disimpan!', true);
    // Generate and download PDF
    generateKuitansiPdf({
      nomor: res.nomor,
      tanggal: d.tgl,
      tglFormatted: d.tglFormatted,
      nama: d.nama,
      nominal: d.nom,
      terbilang: d.tb,
      keterangan: d.ket,
      rekening: d.rek,
      oleh: d.oleh
    });
    // Reset form
    setTimeout(function(){
      document.getElementById('kuit_preview_area').innerHTML='';
      var fields = ['kuit_rekening','kuit_tanggal','kuit_nama','kuit_nominal','kuit_keterangan'];
      fields.forEach(function(id){ var e=document.getElementById(id); if(e) e.value=id==='kuit_tanggal'?new Date().toISOString().split('T')[0]:''; });
      var tb=document.getElementById('kuit_terbilang_preview'); if(tb) tb.textContent='';
    }, 1000);
  }, function(m){ toast('Gagal: '+m, false); if(btn){btn.disabled=false;btn.textContent='✓ Konfirmasi & Generate Kuitansi';} });
}

function konfirmasiKuitansi(encoded) {
  var d = JSON.parse(decodeURIComponent(encoded));
  var btn = document.getElementById('kuit_confirm_btn');
  if(btn){ btn.disabled=true; btn.textContent='Menyimpan...'; }

  gasCall('saveKuitansi',[{
    tanggal: d.tgl,
    nama_donatur: d.nama,
    nominal: d.nom,
    nominal_terbilang: d.tb,
    keterangan: d.ket,
    rekening: d.rek,
    dicatat_oleh: d.oleh
  }], function(res) {
    if(!res.ok){ toast('Gagal simpan: '+(res.msg||''), false); if(btn){btn.disabled=false;btn.textContent='✓ Konfirmasi & Generate Kuitansi';} return; }
    toast('Kuitansi No. '+res.nomor+' berhasil disimpan!', true);
    // Generate and download PDF
    generateKuitansiPdf({
      nomor: res.nomor,

function sortTable(tbodyId, col, type) {
  var tbody = document.getElementById(tbodyId);
  if (!tbody) return;
  var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
  if (!rows.length) return;

  var state = _sortState[tbodyId] || { col: -1, dir: 'asc' };
  var dir = (state.col === col && state.dir === 'asc') ? 'desc' : 'asc';
  _sortState[tbodyId] = { col: col, dir: dir };

  rows.sort(function(a, b) {
    var aC = a.querySelectorAll('td')[col];
    var bC = b.querySelectorAll('td')[col];
    if (!aC || !bC) return 0;
    var aV = aC.getAttribute('data-val') || aC.textContent.trim();
    var bV = bC.getAttribute('data-val') || bC.textContent.trim();
    var result;
    if (type === 'date') {
      result = new Date(aV) - new Date(bV);
    } else if (type === 'num') {
      result = (parseFloat(String(aV).replace(/[^0-9.-]/g,''))||0) -
               (parseFloat(String(bV).replace(/[^0-9.-]/g,''))||0);
    } else {
      result = String(aV).localeCompare(String(bV), 'id');
    }
    return dir === 'asc' ? result : -result;
  });

  rows.forEach(function(r, i) {
    var first = r.querySelectorAll('td')[0];
    if (first && !isNaN(parseInt(first.textContent.trim()))) first.textContent = i + 1;
    tbody.appendChild(r);
  });

  var ths = tbody.parentElement ? tbody.parentElement.querySelectorAll('th.sortable') : [];
  ths.forEach(function(th) {
    th.textContent = th.textContent.replace(' ↑','').replace(' ↓','');
    if (parseInt(th.getAttribute('data-col')) === col) {
      th.textContent += dir === 'asc' ? ' ↑' : ' ↓';
    }
  });
}

// Default sort by date desc on load
function defaultSortDate(tbodyId, col) {
  _sortState[tbodyId] = { col: col, dir: 'desc' };
  sortTable(tbodyId, col, 'date');
  // flip to asc so next click goes asc
  _sortState[tbodyId] = { col: col, dir: 'desc' };
}

function hapusData(shName, id, reloadFn) {
  if (!confirm('Yakin hapus data ini? Tindakan tidak bisa dibatalkan.')) return;
  gasCall('hapusData', [shName, id],
    function(r) {
      toast('Data berhasil dihapus!', true);
      if (reloadFn) {
        var el = document.getElementById('pg' + Array.from(document.querySelectorAll('.pg')).findIndex(function(p){ return p.classList.contains('on'); }));
        if (el) reloadFn(el);
      }
    },
    function(m) { toast('Gagal hapus: ' + m, false); }
  );
}

// ================================================================
//  REFRESH PAGE
// ================================================================
function refreshPage() {
  var pgs = document.querySelectorAll('.pg');
  var activeIdx = 0;
  for (var i = 0; i < pgs.length; i++) {
    if (pgs[i].classList.contains('on')) { activeIdx = i; break; }
  }
  var el = document.getElementById('pg' + activeIdx);
  if (!el || !CU) return;
  var role = CU.role;
  var roleFnMap = {
    tabuk:   [pgTabukSub,pgTabukMon,pgRuanganJadwal],
    badar:   [pgBadarSub,pgBadarMon,pgRuanganJadwal],
    khandaq: [pgKhandaqSub,pgKhandaqMon,pgRuanganJadwal],
    ojol:    [pgOjolSub,pgOjolMon,pgRuanganJadwal],
    resq:    [pgResqSub,pgResqMon,pgRuanganJadwal],
    dakwah:  [pgDakwahSub,pgDakwahMon,pgRuanganJadwal],
    sarpras: [pgSarprasSub,pgSarprasMon,pgRuanganJadwal],
    ruangan: [pgRuanganSub,pgRuanganJadwal],
    monitor: [pgMonitorDash,pgRuanganJadwal],
    staff:   [pgMonitorDash,pgStaffRuangan,pgRuanganJadwal],
    monitor: [pgMonitorDash,pgRuanganJadwal],
    staff:   [pgMonitorDash,pgStaffRuangan,pgRuanganJadwal],
    bendum:  [pgBendumPemasukan,pgBendumImport,pgBendumLap,pgRuanganJadwal],
    admin:   [pgAdminSum,pgAdminBudget,pgAdminTabuk,pgAdminBadar,pgAdminKhandaq,pgAdminOjol,pgAdminKeu,pgAdminRuangan]
  };
  var fns = roleFnMap[role] || [];
  if (fns[activeIdx]) {
    if(el) el.dataset.loaded = '1';
    fns[activeIdx](el);
  }
  toast('Halaman diperbarui', true);
}
